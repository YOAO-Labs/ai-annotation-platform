exclude: ^(\.agents/|\.claude/(settings\.local\.json$|skills/|worktrees/)|\.hermes/|(?:.*/)?(?:vendor|third-party|third_party)/|apps/web/src/api/generated/|apps/api/(openapi|capability-registry)\.snapshot\.json$|docs/(adr/archive/|changelogs/|plans/(archive/|_spike-results/)|benchmarks/|research/data/)|infra/grafana/dashboards/|ROADMAP/archive/|pnpm-lock\.yaml$|skills-lock\.json$|(?:.*/)?(?:uv|yarn)\.lock$|.*\.generated\..*$|.*golden.*\.json$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier (repository text)
        entry: pnpm exec prettier --write --ignore-unknown --ignore-path .prettierignore
        language: system
        files: \.(cjs|css|gql|graphql|html|js|json|json5|jsonc|jsx|md|mdx|mjs|scss|ts|tsx|vue|webmanifest|ya?ml)$
        exclude: ^(\.agents/|\.claude/(settings\.local\.json$|skills/)|apps/web/src/api/generated/|apps/api/(openapi|capability-registry)\.snapshot\.json$|docs/(adr/archive/|changelogs/|plans/(archive/|_spike-results/)|benchmarks/|research/data/)|infra/grafana/dashboards/|ROADMAP/archive/|pnpm-lock\.yaml$|skills-lock\.json$|.*\.generated\..*$|.*golden.*\.json$)

      - id: eslint
        name: eslint (apps/web)
        entry: pnpm --filter web lint
        language: system
        files: ^apps/web/.+\.(ts|tsx|js|jsx)$
        pass_filenames: false
        stages: [pre-commit]

      - id: tsc-web
        name: tsc --noEmit (apps/web)
        entry: pnpm --filter web exec tsc -b --noEmit
        language: system
        files: ^apps/web/.+\.(ts|tsx)$
        pass_filenames: false

      - id: regen-openapi-snapshot
        name: Regenerate OpenAPI snapshot (apps/api)
        entry: bash -c 'cd apps/api && uv run python ../../scripts/export_openapi.py && cd ../.. && git add apps/api/openapi.snapshot.json 2>/dev/null || true'
        language: system
        files: ^(apps/api/app/(config\.py|(api|schemas)/.*\.py)|apps/_shared/protocol_v2/src/.*\.py|apps/(inference|workspace)/src/.*\.py)$
        pass_filenames: false
        stages: [pre-commit]

      - id: regen-capability-registry-snapshot
        name: Regenerate capability registry snapshot (apps/api)
        entry: bash -c 'cd apps/api && uv run python ../../scripts/export_capability_registry.py && cd ../.. && git add apps/api/capability-registry.snapshot.json 2>/dev/null || true'
        language: system
        files: ^(apps/inference/src/yoao_inference/capability_registry\.py|apps/api/app/schemas/ml_capabilities\.py|apps/api/app/api/v1/ml_capabilities\.py)$
        pass_filenames: false
        stages: [pre-commit]

      - id: doc-version-prefix
        name: Check docs for version-prefixed style (advisory)
        entry: node scripts/check-doc-version-prefix.mjs --staged
        language: system
        files: ^(README\.md|DEV\.md)$
        exclude: ^(CHANGELOG\.md|docs/adr/|.*\.generated\.md)$
        pass_filenames: false
        verbose: true

      - id: comment-ratchet
        name: Reject new explanatory comments
        entry: uv run --script scripts/check_comments.py --staged
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: product-naming
        name: Check newly introduced product names
        entry: node scripts/check-product-naming.mjs --staged
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: workflow-names
        name: Check workflow naming
        entry: node scripts/check-workflow-names.mjs --strict
        language: system
        files: ^\.github/workflows/.*\.ya?ml$|^scripts/check-workflow-names\.mjs$
        pass_filenames: false
        verbose: true
