x-mask-content-runtime: &mask-content-runtime
  build:
    context: .
    dockerfile: apps/assets-mask-content/Dockerfile
  extra_hosts:
    - host.docker.internal:host-gateway
  expose:
    - "8770"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  cpus: 0.5
  mem_limit: 256m
  restart: unless-stopped
  stop_grace_period: 30s

services:
  assets-mask-content:
    <<: *mask-content-runtime
    environment:
      MASK_CONTENT_ROLE: content
      MASK_CONTENT_TOKEN_FILE: /run/secrets/mask_content_token
      MASK_CONTENT_S3_ACCESS_KEY_FILE: /run/secrets/mask_content_s3_access_key
      MASK_CONTENT_S3_SECRET_KEY_FILE: /run/secrets/mask_content_s3_secret_key
      MASK_CONTENT_S3_ENDPOINT_URL: ${MASK_CONTENT_S3_ENDPOINT_URL:?Set the internal S3 origin}
      MASK_CONTENT_BUCKET: ${MASK_CONTENT_BUCKET:-${MINIO_BUCKET:-${MINIO_BUCKET_ANNOTATIONS:-annotations}}}
      MASK_CONTENT_REGION: ${MASK_CONTENT_REGION:-us-east-1}
      MASK_CONTENT_HOST: 0.0.0.0
      MASK_CONTENT_PORT: 8770
    secrets:
      - mask_content_token
      - mask_content_s3_access_key
      - mask_content_s3_secret_key

  assets-mask-cleanup:
    <<: *mask-content-runtime
    environment:
      MASK_CONTENT_ROLE: cleanup
      MASK_CONTENT_TOKEN_FILE: /run/secrets/mask_cleanup_token
      MASK_CONTENT_S3_ACCESS_KEY_FILE: /run/secrets/mask_cleanup_s3_access_key
      MASK_CONTENT_S3_SECRET_KEY_FILE: /run/secrets/mask_cleanup_s3_secret_key
      MASK_CONTENT_S3_ENDPOINT_URL: ${MASK_CONTENT_S3_ENDPOINT_URL:?Set the internal S3 origin}
      MASK_CONTENT_BUCKET: ${MASK_CONTENT_BUCKET:-${MINIO_BUCKET:-${MINIO_BUCKET_ANNOTATIONS:-annotations}}}
      MASK_CONTENT_REGION: ${MASK_CONTENT_REGION:-us-east-1}
      MASK_CONTENT_HOST: 0.0.0.0
      MASK_CONTENT_PORT: 8770
    secrets:
      - mask_cleanup_token
      - mask_cleanup_s3_access_key
      - mask_cleanup_s3_secret_key

secrets:
  mask_content_token:
    file: ${MASK_CONTENT_TOKEN_FILE:-./.secrets/assets-mask-content-token}
  mask_content_s3_access_key:
    file: ${MASK_CONTENT_S3_ACCESS_KEY_FILE:-./.secrets/assets-mask-content-s3-access-key}
  mask_content_s3_secret_key:
    file: ${MASK_CONTENT_S3_SECRET_KEY_FILE:-./.secrets/assets-mask-content-s3-secret-key}
  mask_cleanup_token:
    file: ${MASK_CLEANUP_TOKEN_FILE:-./.secrets/assets-mask-cleanup-token}
  mask_cleanup_s3_access_key:
    file: ${MASK_CLEANUP_S3_ACCESS_KEY_FILE:-./.secrets/assets-mask-cleanup-s3-access-key}
  mask_cleanup_s3_secret_key:
    file: ${MASK_CLEANUP_S3_SECRET_KEY_FILE:-./.secrets/assets-mask-cleanup-s3-secret-key}
