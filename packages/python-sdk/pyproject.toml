[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yoao-sdk"
dynamic = ["version"]
description = "YOAO 官方 Python SDK: 同步 Client 覆盖稳定工作流, extras 提供 yoao CLI / TUI"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13.0"]
plugins = ["typer>=0.12", "rich>=13.0", "yoao-inference-contract==0.1.0", "yoao-lifecycle-contract==0.1.0", "yoao-training-contract==0.1.0"]
streams = ["websockets>=12"]
tui = ["textual>=8.2,<9", "typer>=0.12", "rich>=13.0", "websockets>=12"]
test = [
    "pytest>=8.3",
    "respx>=0.21",
    "typer>=0.12",
    "rich>=13.0",
    "textual>=8.2,<9",
    "websockets>=12",
    "pytest-asyncio>=0.24",
]

[project.scripts]
yoao = "yoao.cli.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yoao = ["_operation_catalog.generated.json", "AGENT_GUIDE.md"]

[tool.setuptools.dynamic]
version = { attr = "yoao._version.__version__" }

[tool.uv.sources]
yoao-inference-contract = { path = "../../apps/_shared/inference_contract", editable = true }
yoao-lifecycle-contract = { path = "../../apps/_shared/lifecycle_contract", editable = true }
yoao-training-contract = { path = "../../apps/_shared/training_contract", editable = true }
yoao-task-contract = { path = "../../apps/_shared/task_contract", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
