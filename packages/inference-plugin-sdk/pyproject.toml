[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aap-inference-plugin-sdk"
version = "0.1.0"
description = "Detection authoring tools for AAP inference plugins"
requires-python = ">=3.11"
dependencies = ["aap-protocol-v2", "aap-backend-runtime", "aap-inference-contract", "cryptography>=43", "fastapi>=0.115", "httpx>=0.27", "pillow>=10", "pydantic>=2", "uvicorn>=0.30"]

[project.scripts]
aap-plugin = "aap_inference_plugin.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2,<2"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
aap-protocol-v2 = { path = "../../apps/_shared/protocol_v2", editable = true }
aap-backend-runtime = { path = "../../apps/_shared/backend_runtime", editable = true }
aap-inference-contract = { path = "../../apps/_shared/inference_contract", editable = true }
