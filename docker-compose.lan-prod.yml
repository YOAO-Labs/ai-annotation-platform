  target: /run/secrets/assets_celery_image_database_url
  read_only: true
  bind:
    create_host_path: false

x-runtime-env: &runtime-env
  <<: [*broker-env, *private-env]
  MIGRATION_DATABASE_URL: ""
  ASSETS_VIDEO_EXECUTOR: ${ASSETS_VIDEO_EXECUTOR:-celery}
  ASSETS_IMAGE_EXECUTOR: ${ASSETS_IMAGE_EXECUTOR:-celery}
  ALEMBIC_AUTO_UPGRADE: "false"
  MINIO_TRAINING_BUCKET: ${MINIO_TRAINING_BUCKET:?.env.production must set MINIO_TRAINING_BUCKET}
  MINIO_INPUTS_BUCKET: ${MINIO_INPUTS_BUCKET:?.env.production must set MINIO_INPUTS_BUCKET}

x-notification-publication-secret: &notification-publication-secret
  type: bind
  source: ${NOTIFICATION_PUBLICATION_TOKEN_FILE:-/dev/null}
  target: /run/secrets/notification_publication_token
  read_only: true
  bind:
    create_host_path: false

x-native-image-reader-secret: &native-image-reader-secret
  type: bind
  source: ${ASSETS_MEDIA_NATIVE_IMAGE_STORAGE_TOKEN_FILE:-/dev/null}
  target: /run/secrets/assets_media_native_image_storage_token
  read_only: true
  bind:
    create_host_path: false

x-jobs-publication-secret: &jobs-publication-secret
  type: bind
  source: ${JOBS_PUBLICATION_DATABASE_URL_FILE:-/dev/null}
  target: /run/secrets/jobs_publication_database_url
  read_only: true
  bind:
    create_host_path: false

x-export-execution-secret: &export-execution-secret
  type: bind
  source: ${EXPORT_EXECUTION_DATABASE_URL_FILE:-/dev/null}
  target: /run/secrets/export_execution_database_url
  read_only: true
  bind:
    create_host_path: false

x-process: &process
  image: aap-production-api:${AAP_IMAGE_TAG:?Set AAP_IMAGE_TAG to the deployed revision}
  restart: unless-stopped
  init: true
  logging: *logging
  networks: [production, shared]
  depends_on:
    redis-production:
      condition: service_healthy
  stop_grace_period: 60s

x-runtime: &runtime
  <<: *process
  env_file: .env.production
  environment: *runtime-env

x-worker-health: &worker-health
  test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME -t 10"]
  interval: 30s
  timeout: 15s
  retries: 3
  start_period: 60s

x-worker: &worker
  <<: *runtime
  healthcheck: *worker-health

services:
  api:
    <<: *runtime
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    environment:
      <<:
        [*jobs-publication-env, *notification-producer-env, *native-image-reader-env, *runtime-env]
      NOTIFICATION_SUBSCRIBE_REDIS_URL: ${NOTIFICATION_SUBSCRIBE_REDIS_URL:-}
      NOTIFICATION_SUBSCRIBE_REDIS_URL_FILE: ${NOTIFICATION_SUBSCRIBE_REDIS_URL_FILE:+/run/secrets/notification_subscribe_redis_url}
      IDENTITY_EMBEDDED_SIGNING_SECRET: ${IDENTITY_EMBEDDED_SIGNING_SECRET:-}
      IDENTITY_EMBEDDED_SIGNING_SECRET_FILE: ${IDENTITY_EMBEDDED_SIGNING_SECRET_FILE:+/run/secrets/identity_embedded_signing_secret}
      IDENTITY_RECOVERY_MAIL_KEY: ${IDENTITY_RECOVERY_MAIL_KEY:-}
      IDENTITY_RECOVERY_MAIL_KEY_FILE: ${IDENTITY_RECOVERY_MAIL_KEY_FILE:+/run/secrets/identity_recovery_mail_key}
    volumes:
      - *jobs-publication-secret
      - *notification-publication-secret
      - *native-image-reader-secret
      - type: bind
        source: ${IDENTITY_EMBEDDED_SIGNING_SECRET_FILE:-/dev/null}
        target: /run/secrets/identity_embedded_signing_secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${IDENTITY_RECOVERY_MAIL_KEY_FILE:-/dev/null}
        target: /run/secrets/identity_recovery_mail_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NOTIFICATION_SUBSCRIBE_REDIS_URL_FILE:-/dev/null}
        target: /run/secrets/notification_subscribe_redis_url
        read_only: true
        bind:
          create_host_path: false
      - duckdb:/var/lib/duckdb:ro
      - type: bind
        source: ${AAP_PRODUCTION_STATE_DIR}/known_hosts
        target: /root/.ssh/known_hosts
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=10)",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  migrate:
    <<: *runtime
    profiles: [maintenance]
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'export MIGRATION_DATABASE_URL="$$(cat /run/secrets/migration_database_url)"; exec alembic upgrade head'
    secrets: [migration_database_url]

  web:
    image: aap-production-web:${AAP_IMAGE_TAG:?Set AAP_IMAGE_TAG to the deployed revision}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_EXPERIMENTAL_RASTER_MASK_WEBGPU: ${VITE_EXPERIMENTAL_RASTER_MASK_WEBGPU:-true}
        VITE_EXPERIMENTAL_LARGE_IMAGE_TILES: ${VITE_EXPERIMENTAL_LARGE_IMAGE_TILES:-true}
    restart: unless-stopped
    logging: *logging
    networks: [production, shared]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    logging: *logging
    environment:
      LAN_BIND_IP: ${LAN_BIND_IP:?Set the production host LAN IPv4 address}
    ports:
      - "${LAN_BIND_IP}:3030:3030"
      - "${LAN_BIND_IP}:8080:8080"
    volumes:
      - ./infra/docker/Caddyfile.lan-prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [production]
    depends_on:
      web:
        condition: service_healthy

  redis-production:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: redis-server --appendonly yes --appendfsync everysec
    restart: unless-stopped
    logging: *logging
    volumes:
      - redis_data:/data
    networks: [production]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    <<: *worker
    command: celery -A app.workers.celery_app worker -l info -Q default,media,cleanup,audit --concurrency=4
    environment:
      <<:
        [
          *jobs-publication-env,
          *notification-producer-env,
          *native-image-reader-env,
          *assets-celery-env,
          *runtime-env,
        ]
      NOTIFICATION_PUBLISH_DATABASE_URL: ${NOTIFICATION_PUBLISH_DATABASE_URL:-}
      NOTIFICATION_PUBLISH_DATABASE_URL_FILE: ${NOTIFICATION_PUBLISH_DATABASE_URL_FILE:+/run/secrets/notification_publish_database_url}
      NOTIFICATION_PUBLISH_REDIS_URL: ${NOTIFICATION_PUBLISH_REDIS_URL:-}
      NOTIFICATION_PUBLISH_REDIS_URL_FILE: ${NOTIFICATION_PUBLISH_REDIS_URL_FILE:+/run/secrets/notification_publish_redis_url}
    volumes:
      - *jobs-publication-secret
      - *notification-publication-secret
      - *native-image-reader-secret
      - *assets-celery-video-secret
      - *assets-celery-image-secret
      - type: bind
        source: ${NOTIFICATION_PUBLISH_DATABASE_URL_FILE:-/dev/null}
        target: /run/secrets/notification_publish_database_url
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NOTIFICATION_PUBLISH_REDIS_URL_FILE:-/dev/null}
        target: /run/secrets/notification_publish_redis_url
        read_only: true
        bind:
          create_host_path: false
      - duckdb:/var/lib/duckdb
      - type: bind
        source: ${AAP_PRODUCTION_STATE_DIR}/known_hosts
        target: /root/.ssh/known_hosts
        read_only: true
        bind:
          create_host_path: false

  celery-worker-maintenance:
    <<: *worker
    command: celery -A app.workers.celery_app worker -l info -Q maintenance --concurrency=1 --prefetch-multiplier=1

  celery-worker-gpu:
    <<: *worker
    command: celery -A app.workers.celery_app worker -l info -Q ml,gpu --concurrency=1
    environment:
      <<: [*jobs-publication-env, *assets-celery-env, *runtime-env]
      ASSETS_MASK_CONTENT_URL: ${ASSETS_MASK_CONTENT_URL:-}
      ASSETS_MASK_CONTENT_TOKEN: ${ASSETS_MASK_CONTENT_TOKEN:-}
      ASSETS_MASK_CLEANUP_URL: ""
      ASSETS_MASK_CLEANUP_TOKEN: ""
      ASSETS_MASK_CLEANUP_TOKEN_FILE: ""
    volumes:
      - *jobs-publication-secret
      - *assets-celery-video-secret
      - *assets-celery-image-secret

  celery-worker-cpu:
    <<: *worker
    command: celery -A app.workers.celery_app worker -l info -Q ml.cpu --concurrency=4
    environment:
      <<: [*jobs-publication-env, *assets-celery-env, *runtime-env]
    volumes:
      - *jobs-publication-secret
      - *assets-celery-video-secret
      - *assets-celery-image-secret

  celery-worker-export:
    <<: *worker
    command: celery -A app.workers.celery_app worker -l info -Q export --concurrency=2
    environment:
      <<: [*jobs-publication-env, *notification-producer-env, *runtime-env]
      EXPORT_EXECUTION_DATABASE_URL_FILE: /run/secrets/export_execution_database_url
    volumes:
      - *jobs-publication-secret
      - *notification-publication-secret
      - *export-execution-secret

  celery-worker-image-pyramid:
    <<: *worker
    command: celery -A app.workers.celery_app worker -l info -Q image-pyramid --concurrency=1 --prefetch-multiplier=1 --max-memory-per-child=1572864
    environment:
      <<: [*assets-celery-image-env, *runtime-env]
      VIPS_CONCURRENCY: "4"
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
    volumes:
      - *assets-celery-image-secret

  celery-worker-gpu-control:
    <<: *worker
    command: celery -A app.workers.celery_app worker -l info -Q gpu.control --concurrency=1 --prefetch-multiplier=1

  celery-worker-jobs-recovery:
    <<: *process
    command:
      - /bin/sh
      - -ec
      - >-
        python -m app.workers.jobs_dispatch;
        exec celery -A app.workers.celery_app worker -l info -Q jobs.recovery
        --concurrency=1 --prefetch-multiplier=1
    environment:
      <<: [*broker-env, *jobs-publication-env]
      ALEMBIC_AUTO_UPGRADE: "false"
      JOBS_DISPATCH_DATABASE_URL: ${JOBS_DISPATCH_DATABASE_URL:-}
      JOBS_DISPATCH_DATABASE_URL_FILE: ${JOBS_DISPATCH_DATABASE_URL_FILE:+/run/secrets/jobs_dispatch_database_url}
    volumes:
      - *jobs-publication-secret
      - type: bind
        source: ${JOBS_DISPATCH_DATABASE_URL_FILE:-/dev/null}
        target: /run/secrets/jobs_dispatch_database_url
        read_only: true
        bind:
          create_host_path: false
    healthcheck: *worker-health
    pids_limit: 64
    mem_limit: 1g
    cpus: 1

  celery-beat:
    <<: *runtime
    command: celery -A app.workers.celery_app beat -l info --schedule=/var/lib/celery/celerybeat-schedule
    environment:
      <<: *runtime-env
      NOTIFICATION_PUBLICATION_URL: ${NOTIFICATION_PUBLICATION_URL:-}
    volumes:
      - beat_data:/var/lib/celery
    depends_on:
      redis-production:
        condition: service_healthy
      celery-worker-jobs-recovery:
        condition: service_healthy

networks:
  production:
  shared:
    external: true
    name: ${AAP_SHARED_NETWORK:?Set the existing infrastructure network name}

volumes:
  redis_data:
  duckdb:
  beat_data:
  caddy_data:
  caddy_config:

secrets:
  migration_database_url:
    file: ${AAP_PRODUCTION_STATE_DIR:?Set the local production state directory}/migration-database-url
