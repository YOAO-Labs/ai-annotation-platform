x-jobs-publication-env: &jobs-publication-env
  JOBS_PUBLICATION_DATABASE_URL: ${JOBS_PUBLICATION_DATABASE_URL:-}
  JOBS_PUBLICATION_DATABASE_URL_FILE: ${JOBS_PUBLICATION_DATABASE_URL_FILE:+/run/secrets/jobs_publication_database_url}

x-notification-producer-env: &notification-producer-env
  NOTIFICATION_PUBLICATION_URL: ${NOTIFICATION_PUBLICATION_URL:-}
  NOTIFICATION_PUBLICATION_TOKEN: ${NOTIFICATION_PUBLICATION_TOKEN:-}
  NOTIFICATION_PUBLICATION_TOKEN_FILE: ${NOTIFICATION_PUBLICATION_TOKEN_FILE:+/run/secrets/notification_publication_token}

x-native-image-reader-env: &native-image-reader-env
  ASSETS_MEDIA_NATIVE_IMAGE_STORAGE_URL: ${ASSETS_MEDIA_NATIVE_IMAGE_STORAGE_URL:-}
  ASSETS_MEDIA_NATIVE_IMAGE_STORAGE_TOKEN_FILE: ${ASSETS_MEDIA_NATIVE_IMAGE_STORAGE_TOKEN_FILE:+/run/secrets/assets_media_native_image_storage_token}

x-assets-celery-video-env: &assets-celery-video-env
  ASSETS_CELERY_VIDEO_DATABASE_URL: ${ASSETS_CELERY_VIDEO_DATABASE_URL:-}
  ASSETS_CELERY_VIDEO_DATABASE_URL_FILE: ${ASSETS_CELERY_VIDEO_DATABASE_URL_FILE:+/run/secrets/assets_celery_video_database_url}

x-assets-celery-image-env: &assets-celery-image-env
  ASSETS_CELERY_IMAGE_DATABASE_URL: ${ASSETS_CELERY_IMAGE_DATABASE_URL:-}
  ASSETS_CELERY_IMAGE_DATABASE_URL_FILE: ${ASSETS_CELERY_IMAGE_DATABASE_URL_FILE:+/run/secrets/assets_celery_image_database_url}

x-assets-celery-env: &assets-celery-env
  <<: [*assets-celery-video-env, *assets-celery-image-env]

x-assets-celery-video-secret: &assets-celery-video-secret
  type: bind
  source: ${ASSETS_CELERY_VIDEO_DATABASE_URL_FILE:-/dev/null}
  target: /run/secrets/assets_celery_video_database_url
  read_only: true
  bind:
    create_host_path: false

x-assets-celery-image-secret: &assets-celery-image-secret
  type: bind
