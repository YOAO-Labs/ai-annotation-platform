services:
  training-executor:
    profiles: [training]
    image: ${TRAINING_IMAGE:?Set the training supervisor image repository}@${TRAINING_IMAGE_DIGEST:?Set the immutable image manifest digest}
    environment:
      TRAINING_API_URL: ${TRAINING_API_URL:-http://host.docker.internal:8000/api/v1/internal/training}
      TRAINING_EXECUTOR_TOKEN_FILE: /run/secrets/training_executor_token
      TRAINING_NODE_ID: ${TRAINING_NODE_ID:-local}
      TRAINING_DEVICE_KIND: ${TRAINING_DEVICE_KIND:-gpu}
      TRAINING_GPU_UUID: ${TRAINING_GPU_UUID:-}
      TRAINING_CPU_SLOT: ${TRAINING_CPU_SLOT:-0}
      TRAINING_IMAGE_REFERENCE: ${TRAINING_IMAGE:?Set the training supervisor image repository}@${TRAINING_IMAGE_DIGEST:?Set the immutable image manifest digest}
      TRAINING_LOCAL_PLUGINS_JSON: ${TRAINING_LOCAL_PLUGINS_JSON:-}
      TRAINING_LOCAL_PLUGINS_FILE: ${TRAINING_LOCAL_PLUGINS_FILE:-}
      TRAINING_CONTAINER_RUNTIME: ${TRAINING_CONTAINER_RUNTIME:-docker}
    secrets:
      - training_executor_token
    volumes:
      - training-state:/state
      - ${TRAINING_MODELS_PATH:-./training/models}:/models:ro
      - ${TRAINING_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    extra_hosts:
      - host.docker.internal:host-gateway
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    stop_grace_period: 45s
    restart: unless-stopped

secrets:
  training_executor_token:
    file: ${TRAINING_EXECUTOR_TOKEN_PATH:?Set the private executor token file}

volumes:
  training-state:
