x-prod-infra-env: &prod-infra-env
  <<: *private-env
  DATABASE_URL: ${DATABASE_URL:?.env.production 必须设置 DATABASE_URL}
  MIGRATION_DATABASE_URL: ""
  ALEMBIC_AUTO_UPGRADE: "false"
  ML_MANAGED_BACKEND_URLS: '${ML_MANAGED_BACKEND_URLS:-{"yolo":"http://yolo-backend:8003","onnxtools":"http://onnxtools-backend:8004","rapidocr":"http://rapidocr-backend:8005"}}'
  STORAGE_FILESYSTEM_ROOTS: "${STORAGE_FILESYSTEM_ROOTS:-{}}"
  REDIS_URL: ${REDIS_URL:?.env.production 必须设置 REDIS_URL}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:?.env.production 必须设置 MINIO_ENDPOINT}
  MINIO_INPUTS_BUCKET: ${MINIO_INPUTS_BUCKET:-accepted-inputs}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?.env.production 必须设置 MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?.env.production 必须设置 MINIO_SECRET_KEY}

x-notification-publication-secret: &notification-publication-secret
  type: bind
  source: ${NOTIFICATION_PUBLICATION_TOKEN_FILE:-/dev/null}
  target: /run/secrets/notification_publication_token
  read_only: true
  bind:
    create_host_path: false

services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  minio:
    ports: !reset []
  mailpit: !reset null

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - .env.production
    environment:
      <<:
        [
          *jobs-publication-env,
          *notification-producer-env,
          *native-image-reader-env,
          *assets-source-read-env,
          *assets-source-write-env,
          *assets-source-cleanup-env,
          *private-env,
        ]
      ASSETS_SOURCE_CONNECTIONS_TOKEN_FILE: ${ASSETS_SOURCE_CLIENT_CONNECTIONS_TOKEN_FILE:+/run/secrets/assets_source_connections_token}
      REDIS_URL: ${REDIS_URL:?.env.production 必须设置 REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      ASSETS_VIDEO_EXECUTOR: ${ASSETS_VIDEO_EXECUTOR:-celery}
      ASSETS_IMAGE_EXECUTOR: ${ASSETS_IMAGE_EXECUTOR:-celery}
      NOTIFICATION_SUBSCRIBE_REDIS_URL: ${NOTIFICATION_SUBSCRIBE_REDIS_URL:-}
      NOTIFICATION_SUBSCRIBE_REDIS_URL_FILE: ${NOTIFICATION_SUBSCRIBE_REDIS_URL_FILE:+/run/secrets/notification_subscribe_redis_url}
      IDENTITY_EMBEDDED_SIGNING_SECRET: ${IDENTITY_EMBEDDED_SIGNING_SECRET:-}
      IDENTITY_EMBEDDED_SIGNING_SECRET_FILE: ${IDENTITY_EMBEDDED_SIGNING_SECRET_FILE:+/run/secrets/identity_embedded_signing_secret}
      IDENTITY_RECOVERY_MAIL_KEY: ${IDENTITY_RECOVERY_MAIL_KEY:-}
      IDENTITY_RECOVERY_MAIL_KEY_FILE: ${IDENTITY_RECOVERY_MAIL_KEY_FILE:+/run/secrets/identity_recovery_mail_key}
      GPU_LIFECYCLE_SIGNING_KEYS_FILE: /run/secrets/gpu_lifecycle_signing_keys
      GPU_LIFECYCLE_ACTIVE_SIGNING_KID: ${GPU_LIFECYCLE_ACTIVE_SIGNING_KID:-}
      ML_MANAGED_BACKEND_URLS: '${ML_MANAGED_BACKEND_URLS:-{"yolo":"http://yolo-backend:8003","onnxtools":"http://onnxtools-backend:8004","rapidocr":"http://rapidocr-backend:8005"}}'
      ML_MANAGED_AUTH_DIR: /run/aap-inference-auth
      ML_BACKEND_OPERATIONS_DIR: /run/aap-backend-manager
    volumes:
      - *notification-publication-secret
      - type: bind
        source: ${ASSETS_SOURCE_CLIENT_READ_TOKEN_FILE:-/dev/null}
        target: /run/secrets/assets_source_saved_io_read_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ASSETS_SOURCE_CLIENT_WRITE_TOKEN_FILE:-/dev/null}
        target: /run/secrets/assets_source_saved_io_write_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ASSETS_SOURCE_CLIENT_CLEANUP_TOKEN_FILE:-/dev/null}
        target: /run/secrets/assets_source_saved_io_cleanup_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ASSETS_SOURCE_CLIENT_CONNECTIONS_TOKEN_FILE:-/dev/null}
        target: /run/secrets/assets_source_connections_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${IDENTITY_EMBEDDED_SIGNING_SECRET_FILE:-/dev/null}
        target: /run/secrets/identity_embedded_signing_secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${IDENTITY_RECOVERY_MAIL_KEY_FILE:-/dev/null}
        target: /run/secrets/identity_recovery_mail_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NOTIFICATION_SUBSCRIBE_REDIS_URL_FILE:-/dev/null}
        target: /run/secrets/notification_subscribe_redis_url
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ASSETS_MEDIA_NATIVE_IMAGE_STORAGE_TOKEN_FILE:-/dev/null}
        target: /run/secrets/assets_media_native_image_storage_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${JOBS_PUBLICATION_DATABASE_URL_FILE:-/dev/null}
        target: /run/secrets/jobs_publication_database_url
        read_only: true
        bind:
          create_host_path: false
      - ./config/ssh/known_hosts:/root/.ssh/known_hosts:ro
      - type: bind
        source: ${ML_BACKEND_OPERATIONS_DIR:-./data/backend-manager}
        target: /run/aap-backend-manager
        bind:
          create_host_path: false
      - type: bind
        source: ${ML_MANAGED_AUTH_DIR:-./data/inference-auth}
        target: /run/aap-inference-auth
        bind:
          create_host_path: false
      - type: bind
        source: ${GPU_LIFECYCLE_SIGNING_KEYS_FILE:-/dev/null}
        target: /run/secrets/gpu_lifecycle_signing_keys
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${PROXY_BIND_HOST:-127.0.0.1}:8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_EXPERIMENTAL_RASTER_MASK_WEBGPU: ${VITE_EXPERIMENTAL_RASTER_MASK_WEBGPU:-true}
        VITE_EXPERIMENTAL_LARGE_IMAGE_TILES: ${VITE_EXPERIMENTAL_LARGE_IMAGE_TILES:-true}
    ports:
      - "${PROXY_BIND_HOST:-127.0.0.1}:8088:80"
    depends_on:
      api:
        condition: service_healthy

  celery-worker-maintenance:
    env_file:
      - .env.production
    environment:
      <<: [*assets-source-read-env, *assets-source-write-env, *prod-infra-env]
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-${DATABASE_URL:?.env.production 必须设置 DATABASE_URL}}
    depends_on:
      api:
        condition: service_healthy

  celery-worker:
    env_file:
      - .env.production
    environment:
      <<:
        [
          *jobs-publication-env,
          *notification-producer-env,
          *native-image-reader-env,
          *assets-celery-env,
          *assets-source-read-env,
          *assets-source-write-env,
          *assets-source-cleanup-env,
          *prod-infra-env,
        ]
      NOTIFICATION_PUBLISH_DATABASE_URL: ${NOTIFICATION_PUBLISH_DATABASE_URL:-}
      NOTIFICATION_PUBLISH_DATABASE_URL_FILE: ${NOTIFICATION_PUBLISH_DATABASE_URL_FILE:+/run/secrets/notification_publish_database_url}
      NOTIFICATION_PUBLISH_REDIS_URL: ${NOTIFICATION_PUBLISH_REDIS_URL:-}
      NOTIFICATION_PUBLISH_REDIS_URL_FILE: ${NOTIFICATION_PUBLISH_REDIS_URL_FILE:+/run/secrets/notification_publish_redis_url}
      DUCKDB_PATH: /var/lib/duckdb/analytics.duckdb

  celery-worker-image-pyramid:
    env_file:
      - .env.production
    environment:
      <<:
        [
          *assets-celery-image-env,
          *assets-source-read-env,
          *assets-source-write-env,
          *prod-infra-env,
        ]

  celery-worker-gpu-control:
    env_file:
      - .env.production
    environment:
      <<: *prod-infra-env

  celery-worker-gpu:
    env_file:
      - .env.production
    environment:
      <<:
        [
          *jobs-publication-env,
          *assets-celery-env,
          *assets-source-read-env,
          *assets-source-write-env,
          *assets-source-cleanup-env,
          *prod-infra-env,
        ]
      ASSETS_MASK_CLEANUP_URL: ""
      ASSETS_MASK_CLEANUP_TOKEN: ""
      ASSETS_MASK_CLEANUP_TOKEN_FILE: ""
      DUCKDB_PATH: /var/lib/duckdb/analytics.duckdb

  celery-worker-cpu:
    env_file:
      - .env.production
    environment:
      <<:
        [
          *jobs-publication-env,
          *assets-celery-env,
          *assets-source-read-env,
          *assets-source-write-env,
          *assets-source-cleanup-env,
          *prod-infra-env,
        ]
      DUCKDB_PATH: /var/lib/duckdb/analytics.duckdb

  celery-worker-export:
    env_file:
      - .env.production
    environment:
      <<:
        [
          *jobs-publication-env,
          *notification-producer-env,
          *assets-source-read-env,
          *assets-source-write-env,
          *assets-source-cleanup-env,
          *prod-infra-env,
        ]
      EXPORT_EXECUTION_DATABASE_URL_FILE: /run/secrets/export_execution_database_url
      DUCKDB_PATH: /var/lib/duckdb/analytics.duckdb

  celery-worker-jobs-recovery:
    environment:
      REDIS_URL: ${REDIS_URL:?.env.production 必须设置 REDIS_URL}
    depends_on:
      api:
        condition: service_healthy

  celery-beat:
    env_file:
      - .env.production
    environment:
      <<: *prod-infra-env
      NOTIFICATION_PUBLICATION_URL: ${NOTIFICATION_PUBLICATION_URL:-}

  alertmanager:
    volumes:
      - type: bind
        source: ${ALERTMANAGER_CONFIG_FILE:-./infra/alertmanager/alertmanager.production.yml}
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ALERTMANAGER_SMTP_PASSWORD_FILE:-/dev/null}
        target: /run/secrets/alertmanager_smtp_password
        read_only: true
        bind:
          create_host_path: false
