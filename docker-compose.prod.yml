# 线上叠加文件 · 仅生产使用，把 api / web 容器化并让 celery worker/beat 改用生产配置。
#
#   生产：docker compose --env-file .env.production \
#           -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   开发：docker compose up -d            # 不带本文件 → 只起基础设施，api/web 仍跑宿主机
#
# 必须带 --env-file .env.production：worker 下面用 ${VAR} 插值覆盖基础文件里硬编码的 dev 凭据，
# 插值源由 --env-file 指定（默认 .env 是 dev 用的）。
#
# 为什么 worker 要 inline environment 覆盖、api/web 只用 env_file：
#   docker-compose.yml 给 worker/beat 硬编码了 dev 的 DATABASE_URL/MINIO 凭据（inline environment），
#   而 inline environment 优先级高于 env_file —— 叠加文件光加 env_file 盖不掉，必须再用 inline 覆盖这几个 key。
#   api/web 在基础文件里不存在，无 inline 冲突，env_file 就能注入全部生产配置。
#
# 应用配置统一来自 .env.production（基于 .env.example 复制、逐项审过；已被 .gitignore 忽略，
# ENVIRONMENT=production 时 SECRET_KEY / CORS_ALLOW_ORIGINS / MINIO_SECRET_KEY 等必填，
# 否则启动断言失败 —— 见 docs-site/dev/concepts/runtime-environments.md）。
# 注：前端不读 VITE_API_URL，调用硬编码同源 /api/v1，由 web 容器内 nginx 反代到 api:8000，故 web 镜像无需 build arg。

# worker/beat 共用：覆盖基础文件硬编码的 dev infra 凭据，全部从 .env.production 取（缺失即报错）。
x-prod-infra-env: &prod-infra-env
  DATABASE_URL: ${DATABASE_URL:?.env.production 必须设置 DATABASE_URL}
  MIGRATION_DATABASE_URL: ""
  ALEMBIC_AUTO_UPGRADE: "false"
  REDIS_URL: ${REDIS_URL:?.env.production 必须设置 REDIS_URL}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:?.env.production 必须设置 MINIO_ENDPOINT}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?.env.production 必须设置 MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?.env.production 必须设置 MINIO_SECRET_KEY}

services:
  # 生产不把基础设施端口发布到宿主：api/web/worker 都在 compose 内网，经 service 名
  # DNS（postgres:5432 / redis:6379 / minio:9000）直连即可，无需 host 发布。
  # 基础 docker-compose.yml 为 dev 把它们绑在 0.0.0.0（host 工具直连方便），生产必须收回，
  # 否则 PG/Redis/MinIO 直接暴露在宿主公网网卡上（比 api 端口更危险的直连入口）。
  # ports 合并是 append（覆盖写法盖不掉基础 0.0.0.0），故用 !reset 清空（Compose v2.24+）。
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  minio:
    ports: !reset []
  # mailpit 是 dev 假收件箱，生产本应禁用并改真实 SMTP；若仍随基础栈起来，至少不发布端口。
  mailpit:
    ports: !reset []

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    # entrypoint.sh 启动时自动 alembic upgrade head，再跑 Dockerfile CMD 的 uvicorn。
    env_file:
      - .env.production
    environment:
      GPU_LIFECYCLE_SIGNING_KEYS_FILE: /run/secrets/gpu_lifecycle_signing_keys
      GPU_LIFECYCLE_ACTIVE_SIGNING_KID: ${GPU_LIFECYCLE_ACTIVE_SIGNING_KID:-}
    volumes:
      - ./config/ssh/known_hosts:/root/.ssh/known_hosts:ro
      - type: bind
        source: ${GPU_LIFECYCLE_SIGNING_KEYS_FILE:-/dev/null}
        target: /run/secrets/gpu_lifecycle_signing_keys
        read_only: true
        bind:
          create_host_path: false
    # 默认只绑宿主回环 127.0.0.1：强制流量走外层反代，不直接暴露公网（Docker 发布端口会绕过 ufw）。
    # 外层反代在别的机器时，于 .env.production 设 PROXY_BIND_HOST=<内网IP>（勿用 0.0.0.0）。
    ports:
      - "${PROXY_BIND_HOST:-127.0.0.1}:8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_EXPERIMENTAL_RASTER_MASK_WEBGPU: ${VITE_EXPERIMENTAL_RASTER_MASK_WEBGPU:-true}
        VITE_EXPERIMENTAL_LARGE_IMAGE_TILES: ${VITE_EXPERIMENTAL_LARGE_IMAGE_TILES:-true}
    # 容器内 nginx 监听 80：托管静态产物 + 反代 /api/ /ws/ 到 api:8000。
    # 宿主端口 8088 避开 dev 前端 3000 与 grafana 3001；生产由外层反代 (nginx/Caddy) 终结 TLS 指向它。
    # 同 api：默认绑回环，反代异机时用 PROXY_BIND_HOST 覆盖（见上）。
    ports:
      - "${PROXY_BIND_HOST:-127.0.0.1}:8088:80"
    depends_on:
      api:
        condition: service_healthy

  # 以下 worker/beat 服务已在 docker-compose.yml 定义，这里仅叠加生产环境配置：
  # env_file 注入 ENVIRONMENT/SECRET_KEY/SENTRY 等全部生产变量，environment 覆盖硬编码的 infra 凭据。
  # v0.19.5 起 celery-worker-gpu / celery-worker-cpu 是设备感知预标路由的两条独立 worker
  # (ml = GPU, ml.cpu = CPU), 必须与 celery-worker 同等注入生产 env, 否则用 dev 凭据连不上 DB/MinIO
  # 且 ENVIRONMENT/SECRET_KEY 缺失会触发生产断言失败拒启 → ml.cpu 队列永远无消费者。
  celery-worker-maintenance:
    env_file:
      - .env.production
    environment:
      <<: *prod-infra-env
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-${DATABASE_URL:?.env.production 必须设置 DATABASE_URL}}
    depends_on:
      api:
        condition: service_healthy

  celery-worker:
    env_file:
      - .env.production
    environment:
      <<: *prod-infra-env
      DUCKDB_PATH: /var/lib/duckdb/analytics.duckdb

  celery-worker-image-pyramid:
    env_file:
      - .env.production
    environment:
      <<: *prod-infra-env

  celery-worker-gpu-control:
    env_file:
      - .env.production
    environment:
      <<: *prod-infra-env

  celery-worker-gpu:
    env_file:
      - .env.production
    environment:
      <<: *prod-infra-env
      DUCKDB_PATH: /var/lib/duckdb/analytics.duckdb

  celery-worker-cpu:
    env_file:
      - .env.production
    environment:
      <<: *prod-infra-env
      DUCKDB_PATH: /var/lib/duckdb/analytics.duckdb

  celery-worker-export:
    env_file:
      - .env.production
    environment:
      <<: *prod-infra-env
      DUCKDB_PATH: /var/lib/duckdb/analytics.duckdb

  celery-beat:
    env_file:
      - .env.production
    environment:
      <<: *prod-infra-env
