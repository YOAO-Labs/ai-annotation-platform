x-worker-health: &worker-health
  test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME -t 10"]
  interval: 30s
  timeout: 15s
  retries: 3
  start_period: 40s

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-annotation}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: icr.io/fusion-open/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ${MINIO_DATA_DIR:-miniodata}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker-maintenance:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.workers.celery_app worker -l info -Q maintenance --concurrency=1 --prefetch-multiplier=1
    environment:
      <<: [*celery-env, *assets-source-read-env, *assets-source-write-env]
      DATABASE_URL: ${MIGRATION_DATABASE_URL_DOCKER:-${DATABASE_URL_DOCKER:-postgresql+asyncpg://user:pass@postgres:5432/annotation}}
      INSIGHTS_REFRESH_DATABASE_URL_FILE: ${INSIGHTS_REFRESH_DATABASE_URL_FILE:+/run/secrets/insights_refresh_database_url}
      MIGRATION_DATABASE_URL: ""
      TEST_DATABASE_URL: ""
      PLAYWRIGHT_E2E_DATABASE_URL: ""
      ALEMBIC_AUTO_UPGRADE: "false"
      ML_MANAGED_BACKEND_URLS: '${ML_MANAGED_BACKEND_URLS:-{"yolo":"http://172.17.0.1:8003","onnxtools":"http://172.17.0.1:8004","rapidocr":"http://172.17.0.1:8005"}}'
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_TRAINING_BUCKET: ${MINIO_TRAINING_BUCKET:-training}
      MINIO_INPUTS_BUCKET: ${MINIO_INPUTS_BUCKET:-accepted-inputs}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_AUDIT_ARCHIVE_BUCKET: ${MINIO_AUDIT_ARCHIVE_BUCKET:-audit-archive}
    volumes:
      - *assets-source-read-secret
      - *assets-source-write-secret
      - type: bind
        source: ${INSIGHTS_REFRESH_DATABASE_URL_FILE:-/dev/null}
        target: /run/secrets/insights_refresh_database_url
        read_only: true
        bind:
          create_host_path: false
      - ./apps/api:/app
      - /app/.venv
    healthcheck:
      test:
        ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME -t 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.workers.celery_app worker -l info -Q default,media,cleanup,audit --concurrency=4
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://user:pass@postgres:5432/annotation}
      <<:
        [
          *celery-env,
          *jobs-publication-env,
          *notification-producer-env,
          *assets-celery-video-env,
          *assets-celery-image-env,
          *assets-source-read-env,
          *assets-source-write-env,
          *assets-source-cleanup-env,
        ]
      NOTIFICATION_PUBLISH_DATABASE_URL: ${NOTIFICATION_PUBLISH_DATABASE_URL:-}
      NOTIFICATION_PUBLISH_DATABASE_URL_FILE: ${NOTIFICATION_PUBLISH_DATABASE_URL_FILE:+/run/secrets/notification_publish_database_url}
      NOTIFICATION_PUBLISH_REDIS_URL: ${NOTIFICATION_PUBLISH_REDIS_URL:-}
      NOTIFICATION_PUBLISH_REDIS_URL_FILE: ${NOTIFICATION_PUBLISH_REDIS_URL_FILE:+/run/secrets/notification_publish_redis_url}
      ASSETS_MEDIA_NATIVE_IMAGE_STORAGE_URL: ${ASSETS_MEDIA_NATIVE_IMAGE_STORAGE_URL:-}
      ASSETS_MEDIA_NATIVE_IMAGE_STORAGE_TOKEN_FILE: ${ASSETS_MEDIA_NATIVE_IMAGE_STORAGE_TOKEN_FILE:+/run/secrets/assets_media_native_image_storage_token}
      MIGRATION_DATABASE_URL: ""
      ALEMBIC_AUTO_UPGRADE: "false"
      ML_MANAGED_BACKEND_URLS: '${ML_MANAGED_BACKEND_URLS:-{"yolo":"http://172.17.0.1:8003","onnxtools":"http://172.17.0.1:8004","rapidocr":"http://172.17.0.1:8005"}}'
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_TRAINING_BUCKET: ${MINIO_TRAINING_BUCKET:-training}
      MINIO_INPUTS_BUCKET: ${MINIO_INPUTS_BUCKET:-accepted-inputs}
      TRAINING_ENABLED: ${TRAINING_ENABLED:-false}
      TRAINING_EXECUTOR_TOKEN: ${TRAINING_EXECUTOR_TOKEN:-}
      TRAINING_NODE_ID: ${TRAINING_NODE_ID:-local}
      TRAINING_GPU_UUID: ${TRAINING_GPU_UUID:-}
      TRAINING_CATALOG_JSON: ${TRAINING_CATALOG_JSON:-{}}
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      CONNECTOR_HOST_ALLOWLIST: ${CONNECTOR_HOST_ALLOWLIST:-}
      STORAGE_FILESYSTEM_ROOTS: "${STORAGE_FILESYSTEM_ROOTS:-{}}"
      STORAGE_SFTP_ROOTS: "${STORAGE_SFTP_ROOTS:-{}}"
      GPU_ARBITER_MODE: ${GPU_ARBITER_MODE:-off}
      GPU_ARBITER_ROLLOUT_ENABLED: ${GPU_ARBITER_ROLLOUT_ENABLED:-false}
      GPU_ARBITER_RESOURCES_JSON: ${GPU_ARBITER_RESOURCES_JSON:-{}}
      GPU_ARBITER_RESIDENCY_COOLDOWN_SECONDS: ${GPU_ARBITER_RESIDENCY_COOLDOWN_SECONDS:-30}
      IMAGE_PYRAMID_AUTO_GENERATE: ${IMAGE_PYRAMID_AUTO_GENERATE:-false}
      IMAGE_PYRAMID_OPTIONAL_PIXELS: ${IMAGE_PYRAMID_OPTIONAL_PIXELS:-16777216}
      IMAGE_PYRAMID_REQUIRED_PIXELS: ${IMAGE_PYRAMID_REQUIRED_PIXELS:-50000000}
      IMAGE_PYRAMID_GC_GRACE_HOURS: ${IMAGE_PYRAMID_GC_GRACE_HOURS:-24}
      GPU_LIFECYCLE_SIGNING_KEYS_FILE: /run/secrets/gpu_lifecycle_signing_keys
      GPU_LIFECYCLE_ACTIVE_SIGNING_KID: ${GPU_LIFECYCLE_ACTIVE_SIGNING_KID:-}
      DUCKDB_PATH: /var/lib/duckdb/analytics.duckdb
    volumes:
      - *jobs-publication-secret
      - *notification-publication-secret
      - *native-image-reader-secret
      - *assets-celery-video-secret
      - *assets-celery-image-secret
      - *assets-source-read-secret
      - *assets-source-write-secret
      - *assets-source-cleanup-secret
      - type: bind
        source: ${NOTIFICATION_PUBLISH_DATABASE_URL_FILE:-/dev/null}
        target: /run/secrets/notification_publish_database_url
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${NOTIFICATION_PUBLISH_REDIS_URL_FILE:-/dev/null}
        target: /run/secrets/notification_publish_redis_url
        read_only: true
        bind:
          create_host_path: false
      - ./data/duckdb:/var/lib/duckdb
      - ./config/ssh/known_hosts:/root/.ssh/known_hosts:ro
      - ./apps/api:/app
      - /app/.venv
      - type: bind
        source: ${GPU_LIFECYCLE_SIGNING_KEYS_FILE:-/dev/null}
        target: /run/secrets/gpu_lifecycle_signing_keys
        read_only: true
        bind:
          create_host_path: false
    healthcheck: *worker-health
    stop_grace_period: 30s
    depends_on:
      celery-worker-maintenance:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-worker-image-pyramid:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.workers.celery_app worker -l info -Q image-pyramid --concurrency=1 --prefetch-multiplier=1 --max-memory-per-child=1572864
    environment:
      <<: [*celery-env, *assets-celery-image-env, *assets-source-read-env, *assets-source-write-env]
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://user:pass@postgres:5432/annotation}
      ALEMBIC_AUTO_UPGRADE: "false"
      ML_MANAGED_BACKEND_URLS: '${ML_MANAGED_BACKEND_URLS:-{"yolo":"http://172.17.0.1:8003","onnxtools":"http://172.17.0.1:8004","rapidocr":"http://172.17.0.1:8005"}}'
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_TRAINING_BUCKET: ${MINIO_TRAINING_BUCKET:-training}
      MINIO_INPUTS_BUCKET: ${MINIO_INPUTS_BUCKET:-accepted-inputs}
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      IMAGE_PYRAMID_AUTO_GENERATE: ${IMAGE_PYRAMID_AUTO_GENERATE:-false}
      IMAGE_PYRAMID_PROFILE_VERSION: ${IMAGE_PYRAMID_PROFILE_VERSION:-pyramid-v1}
      IMAGE_PYRAMID_NORMALIZATION_VERSION: ${IMAGE_PYRAMID_NORMALIZATION_VERSION:-exif-autorotate-srgb-v1}
      IMAGE_PYRAMID_OPTIONAL_PIXELS: ${IMAGE_PYRAMID_OPTIONAL_PIXELS:-16777216}
      IMAGE_PYRAMID_REQUIRED_PIXELS: ${IMAGE_PYRAMID_REQUIRED_PIXELS:-50000000}
      IMAGE_PYRAMID_MAX_PIXELS: ${IMAGE_PYRAMID_MAX_PIXELS:-300000000}
      IMAGE_PYRAMID_MAX_DIMENSION: ${IMAGE_PYRAMID_MAX_DIMENSION:-32768}
      IMAGE_PYRAMID_MAX_TILES: ${IMAGE_PYRAMID_MAX_TILES:-20000}
      IMAGE_PYRAMID_MAX_SOURCE_BYTES: ${IMAGE_PYRAMID_MAX_SOURCE_BYTES:-8589934592}
      IMAGE_PYRAMID_MAX_DERIVED_BYTES: ${IMAGE_PYRAMID_MAX_DERIVED_BYTES:-8589934592}
      IMAGE_PYRAMID_MAX_TEMP_BYTES: ${IMAGE_PYRAMID_MAX_TEMP_BYTES:-12884901888}
      IMAGE_PYRAMID_JOB_TIMEOUT_SECONDS: ${IMAGE_PYRAMID_JOB_TIMEOUT_SECONDS:-1800}
      IMAGE_PYRAMID_LEASE_SECONDS: ${IMAGE_PYRAMID_LEASE_SECONDS:-2100}
      IMAGE_PYRAMID_VIPS_CONCURRENCY: ${IMAGE_PYRAMID_VIPS_CONCURRENCY:-4}
      VIPS_CONCURRENCY: ${IMAGE_PYRAMID_VIPS_CONCURRENCY:-4}
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
      IMAGE_PYRAMID_SRGB_PROFILE: ${IMAGE_PYRAMID_SRGB_PROFILE:-/usr/share/color/icc/sRGB.icc}
    volumes:
      - *assets-celery-image-secret
      - *assets-source-read-secret
      - *assets-source-write-secret
      - ./apps/api:/app
      - /app/.venv
    healthcheck:
      test:
        ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME -t 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    stop_grace_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-worker-gpu-control:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.workers.celery_app worker -l info -Q gpu.control --concurrency=1 --prefetch-multiplier=1
    environment:
      <<: *celery-env
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://user:pass@postgres:5432/annotation}
      ALEMBIC_AUTO_UPGRADE: "false"
      ML_MANAGED_BACKEND_URLS: '${ML_MANAGED_BACKEND_URLS:-{"yolo":"http://172.17.0.1:8003","onnxtools":"http://172.17.0.1:8004","rapidocr":"http://172.17.0.1:8005"}}'
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_TRAINING_BUCKET: ${MINIO_TRAINING_BUCKET:-training}
      MINIO_INPUTS_BUCKET: ${MINIO_INPUTS_BUCKET:-accepted-inputs}
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      GPU_ARBITER_MODE: ${GPU_ARBITER_MODE:-off}
      GPU_ARBITER_ROLLOUT_ENABLED: ${GPU_ARBITER_ROLLOUT_ENABLED:-false}
      GPU_ARBITER_COLLECTOR_DATABASE_URL_FILE: /run/secrets/gpu_arbiter_collector_database_url
      GPU_ARBITER_RESOURCES_JSON: ${GPU_ARBITER_RESOURCES_JSON:-{}}
      GPU_ARBITER_ADMISSION_TIMEOUT_SECONDS: ${GPU_ARBITER_ADMISSION_TIMEOUT_SECONDS:-30}
      GPU_ARBITER_RESIDENCY_COOLDOWN_SECONDS: ${GPU_ARBITER_RESIDENCY_COOLDOWN_SECONDS:-30}
      GPU_LIFECYCLE_SIGNING_KEYS_FILE: /run/secrets/gpu_lifecycle_signing_keys
      GPU_LIFECYCLE_ACTIVE_SIGNING_KID: ${GPU_LIFECYCLE_ACTIVE_SIGNING_KID:-}
    volumes:
      - ./apps/api:/app
      - /app/.venv
      - type: bind
        source: ${GPU_LIFECYCLE_SIGNING_KEYS_FILE:-/dev/null}
        target: /run/secrets/gpu_lifecycle_signing_keys
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GPU_ARBITER_COLLECTOR_DATABASE_URL_FILE:-/dev/null}
        target: /run/secrets/gpu_arbiter_collector_database_url
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME -t 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery-worker-gpu:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.workers.celery_app worker -l info -Q ml,gpu --concurrency=${CELERY_GPU_CONCURRENCY:-2}
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://user:pass@postgres:5432/annotation}
      <<:
        [
          *celery-env,
          *jobs-publication-env,
          *assets-celery-video-env,
          *assets-celery-image-env,
          *assets-source-read-env,
          *assets-source-write-env,
          *assets-source-cleanup-env,
        ]
      ASSETS_MASK_CONTENT_URL: ${ASSETS_MASK_CONTENT_URL:-}
      ASSETS_MASK_CONTENT_TOKEN: ${ASSETS_MASK_CONTENT_TOKEN:-}
      ALEMBIC_AUTO_UPGRADE: "false"
      ML_MANAGED_BACKEND_URLS: '${ML_MANAGED_BACKEND_URLS:-{"yolo":"http://172.17.0.1:8003","onnxtools":"http://172.17.0.1:8004","rapidocr":"http://172.17.0.1:8005"}}'
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_TRAINING_BUCKET: ${MINIO_TRAINING_BUCKET:-training}
      MINIO_INPUTS_BUCKET: ${MINIO_INPUTS_BUCKET:-accepted-inputs}
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      DUCKDB_PATH: /var/lib/duckdb/analytics.duckdb
      GPU_ARBITER_MODE: ${GPU_ARBITER_MODE:-off}
      GPU_ARBITER_ROLLOUT_ENABLED: ${GPU_ARBITER_ROLLOUT_ENABLED:-false}
      GPU_ARBITER_RESOURCES_JSON: ${GPU_ARBITER_RESOURCES_JSON:-{}}
      GPU_ARBITER_ADMISSION_TIMEOUT_SECONDS: ${GPU_ARBITER_ADMISSION_TIMEOUT_SECONDS:-30}
      GPU_ARBITER_RESIDENCY_COOLDOWN_SECONDS: ${GPU_ARBITER_RESIDENCY_COOLDOWN_SECONDS:-30}
      GPU_LIFECYCLE_SIGNING_KEYS_FILE: /run/secrets/gpu_lifecycle_signing_keys
      GPU_LIFECYCLE_ACTIVE_SIGNING_KID: ${GPU_LIFECYCLE_ACTIVE_SIGNING_KID:-}
      VIDEO_TRACKER_SAM3_WINDOW_SIZE_FRAMES: ${VIDEO_TRACKER_SAM3_WINDOW_SIZE_FRAMES:-16}
    volumes:
      - *assets-celery-video-secret
      - *assets-celery-image-secret
      - *assets-source-read-secret
      - *assets-source-write-secret
      - *assets-source-cleanup-secret
      - *jobs-publication-secret
      - ./data/duckdb:/var/lib/duckdb
      - ./config/ssh/known_hosts:/root/.ssh/known_hosts:ro
      - ./apps/api:/app
      - /app/.venv
      - type: bind
        source: ${GPU_LIFECYCLE_SIGNING_KEYS_FILE:-/dev/null}
        target: /run/secrets/gpu_lifecycle_signing_keys
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME -t 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-worker-cpu:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.workers.celery_app worker -l info -Q ml.cpu --concurrency=${CELERY_CPU_CONCURRENCY:-4}
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://user:pass@postgres:5432/annotation}
      <<:
        [
          *celery-env,
          *jobs-publication-env,
          *assets-celery-video-env,
          *assets-celery-image-env,
          *assets-source-read-env,
          *assets-source-write-env,
          *assets-source-cleanup-env,
        ]
      ALEMBIC_AUTO_UPGRADE: "false"
      ML_MANAGED_BACKEND_URLS: '${ML_MANAGED_BACKEND_URLS:-{"yolo":"http://172.17.0.1:8003","onnxtools":"http://172.17.0.1:8004","rapidocr":"http://172.17.0.1:8005"}}'
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_TRAINING_BUCKET: ${MINIO_TRAINING_BUCKET:-training}
      MINIO_INPUTS_BUCKET: ${MINIO_INPUTS_BUCKET:-accepted-inputs}
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      DUCKDB_PATH: /var/lib/duckdb/analytics.duckdb
      GPU_ARBITER_MODE: ${GPU_ARBITER_MODE:-off}
      GPU_ARBITER_ROLLOUT_ENABLED: ${GPU_ARBITER_ROLLOUT_ENABLED:-false}
      GPU_ARBITER_RESOURCES_JSON: ${GPU_ARBITER_RESOURCES_JSON:-{}}
      GPU_ARBITER_ADMISSION_TIMEOUT_SECONDS: ${GPU_ARBITER_ADMISSION_TIMEOUT_SECONDS:-30}
      GPU_ARBITER_RESIDENCY_COOLDOWN_SECONDS: ${GPU_ARBITER_RESIDENCY_COOLDOWN_SECONDS:-30}
    volumes:
      - *assets-celery-video-secret
      - *assets-celery-image-secret
      - *assets-source-read-secret
      - *assets-source-write-secret
      - *assets-source-cleanup-secret
      - *jobs-publication-secret
      - ./data/duckdb:/var/lib/duckdb
      - ./config/ssh/known_hosts:/root/.ssh/known_hosts:ro
      - ./apps/api:/app
      - /app/.venv
    healthcheck:
      test:
        ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME -t 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-worker-export:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.workers.celery_app worker -l info -Q export --concurrency=2
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://user:pass@postgres:5432/annotation}
      <<:
        [
          *celery-env,
          *jobs-publication-env,
          *notification-producer-env,
          *assets-source-read-env,
          *assets-source-write-env,
          *assets-source-cleanup-env,
        ]
      EXPORT_EXECUTION_DATABASE_URL_FILE: /run/secrets/export_execution_database_url
      ALEMBIC_AUTO_UPGRADE: "false"
      ML_MANAGED_BACKEND_URLS: '${ML_MANAGED_BACKEND_URLS:-{"yolo":"http://172.17.0.1:8003","onnxtools":"http://172.17.0.1:8004","rapidocr":"http://172.17.0.1:8005"}}'
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_TRAINING_BUCKET: ${MINIO_TRAINING_BUCKET:-training}
      MINIO_INPUTS_BUCKET: ${MINIO_INPUTS_BUCKET:-accepted-inputs}
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      GPU_ARBITER_MODE: ${GPU_ARBITER_MODE:-off}
      GPU_ARBITER_ROLLOUT_ENABLED: ${GPU_ARBITER_ROLLOUT_ENABLED:-false}
      GPU_ARBITER_RESOURCES_JSON: ${GPU_ARBITER_RESOURCES_JSON:-{}}
      GPU_ARBITER_RESIDENCY_COOLDOWN_SECONDS: ${GPU_ARBITER_RESIDENCY_COOLDOWN_SECONDS:-30}
      DUCKDB_PATH: /var/lib/duckdb/analytics.duckdb
    volumes:
      - *jobs-publication-secret
      - *notification-publication-secret
      - *assets-source-read-secret
      - *assets-source-write-secret
      - *assets-source-cleanup-secret
      - *export-execution-secret
      - ./data/duckdb:/var/lib/duckdb
      - ./apps/api:/app
      - /app/.venv
    healthcheck:
      test:
        ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME -t 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-worker-jobs-recovery:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command:
      - /bin/sh
      - -ec
      - >-
        python -m app.workers.jobs_dispatch;
        exec celery -A app.workers.celery_app worker -l info -Q jobs.recovery
        --concurrency=1 --prefetch-multiplier=1
    environment:
      <<: *jobs-publication-env
      ALEMBIC_AUTO_UPGRADE: "false"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
      JOBS_DISPATCH_DATABASE_URL: ${JOBS_DISPATCH_DATABASE_URL:-}
      JOBS_DISPATCH_DATABASE_URL_FILE: ${JOBS_DISPATCH_DATABASE_URL_FILE:+/run/secrets/jobs_dispatch_database_url}
    volumes:
      - *jobs-publication-secret
      - type: bind
        source: ${JOBS_DISPATCH_DATABASE_URL_FILE:-/dev/null}
        target: /run/secrets/jobs_dispatch_database_url
        read_only: true
        bind:
          create_host_path: false
    healthcheck: *worker-health
    stop_grace_period: 30s
    pids_limit: 64
    mem_limit: 1g
    cpus: 1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.workers.celery_app beat -l info --schedule=/tmp/celerybeat-schedule
    environment:
      <<: *celery-env
      NOTIFICATION_PUBLICATION_URL: ${NOTIFICATION_PUBLICATION_URL:-}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://user:pass@postgres:5432/annotation}
      ALEMBIC_AUTO_UPGRADE: "false"
      ML_MANAGED_BACKEND_URLS: '${ML_MANAGED_BACKEND_URLS:-{"yolo":"http://172.17.0.1:8003","onnxtools":"http://172.17.0.1:8004","rapidocr":"http://172.17.0.1:8005"}}'
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_TRAINING_BUCKET: ${MINIO_TRAINING_BUCKET:-training}
      MINIO_INPUTS_BUCKET: ${MINIO_INPUTS_BUCKET:-accepted-inputs}
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      GPU_ARBITER_MODE: ${GPU_ARBITER_MODE:-off}
      GPU_ARBITER_ROLLOUT_ENABLED: ${GPU_ARBITER_ROLLOUT_ENABLED:-false}
      GPU_ARBITER_RESOURCES_JSON: ${GPU_ARBITER_RESOURCES_JSON:-{}}
      GPU_ARBITER_RESIDENCY_COOLDOWN_SECONDS: ${GPU_ARBITER_RESIDENCY_COOLDOWN_SECONDS:-30}
    volumes:
      - ./apps/api:/app
      - /app/.venv
    stop_grace_period: 30s
    depends_on:
      celery-worker-jobs-recovery:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=14d"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana-oss:11.4.0
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    ports:
      - "9093:9093"
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

volumes:
  pgdata:
  miniodata:
  prometheus_data:
  grafana_data:
  alertmanager_data:
