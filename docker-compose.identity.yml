x-identity-runtime-image: &identity-runtime-image
  image: aap-identity:local
  build:
    context: .
    dockerfile: apps/identity/Dockerfile

services:
  identity-admission:
    <<: *identity-runtime-image
    environment:
      IDENTITY_HOST: 0.0.0.0
      IDENTITY_PORT: 8170
      IDENTITY_DATABASE_URL_FILE: /run/secrets/identity_database_url
      IDENTITY_KEY_DATABASE_URL_FILE: /run/secrets/identity_key_database_url
      IDENTITY_SESSION_DATABASE_URL_FILE: /run/secrets/identity_session_database_url
      IDENTITY_ACCOUNT_DATABASE_URL_FILE: /run/secrets/identity_account_database_url
      IDENTITY_PRESENCE_DATABASE_URL_FILE: /run/secrets/identity_presence_database_url
      IDENTITY_GROUP_DATABASE_URL_FILE: /run/secrets/identity_group_database_url
      IDENTITY_DIRECTORY_DATABASE_URL_FILE: ${IDENTITY_RUNTIME_DIRECTORY_DATABASE_URL_FILE:+/run/secrets/identity_directory_database_url}
      IDENTITY_ADMIN_PASSWORD_DATABASE_URL_FILE: ${IDENTITY_RUNTIME_ADMIN_PASSWORD_DATABASE_URL_FILE:+/run/secrets/identity_admin_password_database_url}
      IDENTITY_PLATFORM_ROLE_DATABASE_URL_FILE: ${IDENTITY_RUNTIME_PLATFORM_ROLE_DATABASE_URL_FILE:+/run/secrets/identity_platform_role_database_url}
      IDENTITY_SUSPENSION_DATABASE_URL_FILE: ${IDENTITY_RUNTIME_SUSPENSION_DATABASE_URL_FILE:+/run/secrets/identity_suspension_database_url}
      IDENTITY_DELETION_DATABASE_URL_FILE: ${IDENTITY_RUNTIME_DELETION_DATABASE_URL_FILE:+/run/secrets/identity_deletion_database_url}
      IDENTITY_OFFBOARDING_DATABASE_URL_FILE: ${IDENTITY_RUNTIME_OFFBOARDING_DATABASE_URL_FILE:+/run/secrets/identity_offboarding_database_url}
      IDENTITY_BRIEFS_DATABASE_URL_FILE: ${IDENTITY_RUNTIME_BRIEFS_DATABASE_URL_FILE:+/run/secrets/identity_briefs_database_url}
      IDENTITY_INVITATION_DATABASE_URL_FILE: /run/secrets/identity_invitation_database_url
      IDENTITY_DEACTIVATION_DATABASE_URL_FILE: /run/secrets/identity_deactivation_database_url
      IDENTITY_DEACTIVATION_OPERATOR_DATABASE_URL_FILE: /run/secrets/identity_deactivation_operator_database_url
      IDENTITY_RECOVERY_DATABASE_URL_FILE: /run/secrets/identity_recovery_database_url
      IDENTITY_RECOVERY_MAIL_KEY_FILE: /run/secrets/identity_recovery_mail_key
      IDENTITY_LOGIN_REDIS_URL_FILE: /run/secrets/identity_login_redis_url
      IDENTITY_EXPIRE_MINUTES: ${IDENTITY_RUNTIME_EXPIRE_MINUTES:-1440}
      IDENTITY_EMAIL_VERIFICATION_REQUIRED: ${IDENTITY_RUNTIME_EMAIL_VERIFICATION_REQUIRED:-false}
      IDENTITY_ALLOW_OPEN_REGISTRATION: ${IDENTITY_RUNTIME_ALLOW_OPEN_REGISTRATION:-false}
      IDENTITY_FRONTEND_BASE_URL: ${IDENTITY_RUNTIME_FRONTEND_BASE_URL:-http://localhost:3000}
      IDENTITY_INVITATION_FRONTEND_BASE_URL: ${IDENTITY_INVITATION_FRONTEND_BASE_URL:-http://localhost:5173}
      IDENTITY_LOGIN_CAPTCHA_THRESHOLD: ${IDENTITY_RUNTIME_LOGIN_CAPTCHA_THRESHOLD:-5}
      IDENTITY_LOGIN_FAILED_WINDOW_SECONDS: ${IDENTITY_RUNTIME_LOGIN_FAILED_WINDOW_SECONDS:-3600}
      IDENTITY_TOKEN_FILE: /run/secrets/identity_token
      IDENTITY_ADMISSION_TOKEN_FILE: ${IDENTITY_RUNTIME_ADMISSION_TOKEN_FILE:+/run/secrets/identity_admission_token}
      IDENTITY_ACTOR_STATUS_DATABASE_URL_FILE: ${IDENTITY_RUNTIME_ACTOR_STATUS_DATABASE_URL_FILE:+/run/secrets/identity_actor_status_database_url}
      IDENTITY_SIGNING_SECRET_FILE: /run/secrets/identity_signing_secret
    secrets:
      - identity_database_url
      - identity_key_database_url
      - identity_session_database_url
      - identity_account_database_url
      - identity_presence_database_url
      - identity_group_database_url
      - identity_directory_database_url
      - identity_admin_password_database_url
      - identity_platform_role_database_url
      - identity_suspension_database_url
      - identity_deletion_database_url
      - identity_offboarding_database_url
      - identity_briefs_database_url
      - identity_invitation_database_url
      - identity_deactivation_database_url
      - identity_deactivation_operator_database_url
      - identity_recovery_database_url
      - identity_recovery_mail_key
      - identity_login_redis_url
      - identity_token
      - identity_admission_token
      - identity_actor_status_database_url
      - identity_signing_secret
    ports:
      - "127.0.0.1:8170:8170"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1

  identity-mail:
    <<: *identity-runtime-image
    command: ["python", "-m", "aap_identity_runtime.mail_worker"]
    environment:
      IDENTITY_MAIL_DATABASE_URL_FILE: /run/secrets/identity_mail_database_url
      IDENTITY_MAIL_SETTINGS_DATABASE_URL_FILE: /run/secrets/identity_mail_settings_database_url
      IDENTITY_MAIL_ENCRYPTION_KEY_FILE: /run/secrets/identity_recovery_mail_key
      IDENTITY_MAIL_SMTP_HOST: ${IDENTITY_MAIL_SMTP_HOST:-}
      IDENTITY_MAIL_SMTP_PORT: ${IDENTITY_MAIL_SMTP_PORT:-0}
      IDENTITY_MAIL_SMTP_USER: ${IDENTITY_MAIL_SMTP_USER:-}
      IDENTITY_MAIL_SMTP_PASSWORD: ${IDENTITY_MAIL_SMTP_PASSWORD:-}
      IDENTITY_MAIL_SMTP_FROM: ${IDENTITY_MAIL_SMTP_FROM:-}
    secrets:
      - identity_mail_database_url
      - identity_mail_settings_database_url
      - identity_recovery_mail_key
    user: "10003:10003"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8171/ready', timeout=2)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  identity-mail-v2:
    <<: *identity-runtime-image
    profiles: ["mail-v2"]
    command: ["python", "-m", "aap_identity_runtime.mail_worker_v2"]
    environment:
      IDENTITY_MAIL_V2_DATABASE_URL_FILE: /run/secrets/identity_mail_v2_database_url
      IDENTITY_MAIL_V2_SETTINGS_DATABASE_URL_FILE: /run/secrets/identity_mail_settings_database_url
      IDENTITY_MAIL_V2_ENCRYPTION_KEY_FILE: /run/secrets/identity_recovery_mail_key
      IDENTITY_MAIL_V2_SMTP_HOST: ${IDENTITY_MAIL_SMTP_HOST:-}
      IDENTITY_MAIL_V2_SMTP_PORT: ${IDENTITY_MAIL_SMTP_PORT:-0}
      IDENTITY_MAIL_V2_SMTP_USER: ${IDENTITY_MAIL_SMTP_USER:-}
      IDENTITY_MAIL_V2_SMTP_PASSWORD: ${IDENTITY_MAIL_SMTP_PASSWORD:-}
      IDENTITY_MAIL_V2_SMTP_FROM: ${IDENTITY_MAIL_SMTP_FROM:-}
    secrets:
      - identity_mail_v2_database_url
      - identity_mail_settings_database_url
      - identity_recovery_mail_key
    user: "10003:10003"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8171/ready', timeout=2)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  identity-notification-publisher:
    <<: *identity-runtime-image
    command: ["python", "-m", "aap_identity_runtime.notification_worker"]
    environment:
      NOTIFICATION_PUBLISH_DATABASE_URL_FILE: /run/secrets/notification_publish_database_url
      NOTIFICATION_PUBLISH_REDIS_URL_FILE: /run/secrets/notification_publish_redis_url
    secrets:
      - notification_publish_database_url
      - notification_publish_redis_url
    user: "10003:10003"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    healthcheck:
      disable: true

secrets:
  identity_database_url:
    file: ${IDENTITY_RUNTIME_DATABASE_URL_FILE:?Set Identity function-only DSN file}
  identity_key_database_url:
    file: ${IDENTITY_RUNTIME_KEY_DATABASE_URL_FILE:?Set Identity API-key command DSN file}
  identity_session_database_url:
    file: ${IDENTITY_RUNTIME_SESSION_DATABASE_URL_FILE:?Set Identity session command DSN file}
  identity_account_database_url:
    file: ${IDENTITY_RUNTIME_ACCOUNT_DATABASE_URL_FILE:?Set Identity account command DSN file}
  identity_presence_database_url:
    file: ${IDENTITY_RUNTIME_PRESENCE_DATABASE_URL_FILE:?Set Identity presence operator DSN file}
  identity_group_database_url:
    file: ${IDENTITY_RUNTIME_GROUP_DATABASE_URL_FILE:?Set Identity group function-only DSN file}
  identity_directory_database_url:
    file: ${IDENTITY_RUNTIME_DIRECTORY_DATABASE_URL_FILE:-/dev/null}
  identity_admin_password_database_url:
    file: ${IDENTITY_RUNTIME_ADMIN_PASSWORD_DATABASE_URL_FILE:-/dev/null}
  identity_platform_role_database_url:
    file: ${IDENTITY_RUNTIME_PLATFORM_ROLE_DATABASE_URL_FILE:-/dev/null}
  identity_suspension_database_url:
    file: ${IDENTITY_RUNTIME_SUSPENSION_DATABASE_URL_FILE:-/dev/null}
  identity_deletion_database_url:
    file: ${IDENTITY_RUNTIME_DELETION_DATABASE_URL_FILE:-/dev/null}
  identity_offboarding_database_url:
    file: ${IDENTITY_RUNTIME_OFFBOARDING_DATABASE_URL_FILE:-/dev/null}
  identity_briefs_database_url:
    file: ${IDENTITY_RUNTIME_BRIEFS_DATABASE_URL_FILE:-/dev/null}
  identity_invitation_database_url:
    file: ${IDENTITY_RUNTIME_INVITATION_DATABASE_URL_FILE:?Set Identity invitation function-only DSN file}
  identity_mail_v2_database_url:
    file: ${IDENTITY_RUNTIME_MAIL_V2_DATABASE_URL_FILE:-/dev/null}
  identity_deactivation_database_url:
    file: ${IDENTITY_RUNTIME_DEACTIVATION_DATABASE_URL_FILE:?Set Identity deactivation command DSN file}
  identity_deactivation_operator_database_url:
    file: ${IDENTITY_RUNTIME_DEACTIVATION_OPERATOR_DATABASE_URL_FILE:?Set Identity deactivation operator DSN file}
  notification_publish_database_url:
    file: ${IDENTITY_RUNTIME_NOTIFICATION_PUBLISH_DATABASE_URL_FILE:?Set Notifications publisher DSN file}
  notification_publish_redis_url:
    file: ${IDENTITY_RUNTIME_NOTIFICATION_PUBLISH_REDIS_URL_FILE:?Set Notifications publisher Redis DSN file}
  identity_recovery_database_url:
    file: ${IDENTITY_RUNTIME_RECOVERY_DATABASE_URL_FILE:?Set Identity recovery function-only DSN file}
  identity_recovery_mail_key:
    file: ${IDENTITY_RUNTIME_RECOVERY_MAIL_KEY_FILE:?Set Identity recovery Fernet key file}
  identity_mail_database_url:
    file: ${IDENTITY_RUNTIME_MAIL_DATABASE_URL_FILE:?Set Identity mail function-only DSN file}
  identity_mail_settings_database_url:
    file: ${IDENTITY_RUNTIME_MAIL_SETTINGS_DATABASE_URL_FILE:?Set Identity mail Settings-only DSN file}
  identity_login_redis_url:
    file: ${IDENTITY_RUNTIME_LOGIN_REDIS_URL_FILE:?Set Identity login-only Redis DSN file}
  identity_token:
    file: ${IDENTITY_RUNTIME_TOKEN_FILE:?Set Identity private bearer file}
  identity_admission_token:
    file: ${IDENTITY_RUNTIME_ADMISSION_TOKEN_FILE:-/dev/null}
  identity_actor_status_database_url:
    file: ${IDENTITY_RUNTIME_ACTOR_STATUS_DATABASE_URL_FILE:-/dev/null}
  identity_signing_secret:
    file: ${IDENTITY_RUNTIME_SIGNING_SECRET_FILE:?Set Identity JWT signing secret file}
