# Optional Guide byte binding for the existing Configuration process.
# Combine with docker-compose.workspace-configuration.yml; reuse Assets Source.
services:
  workspace-configuration:
    environment:
      WORKSPACE_GUIDE_OBJECTS_URL: ${WORKSPACE_GUIDE_OBJECTS_URL:?Set the reachable Assets Source Guide origin}
      WORKSPACE_GUIDE_OBJECTS_TOKEN_FILE: /run/secrets/guide_objects_token
      WORKSPACE_GUIDE_OBJECTS_TIMEOUT_SECONDS: ${WORKSPACE_GUIDE_OBJECTS_TIMEOUT_SECONDS:-15}
    secrets:
      - guide_objects_token

secrets:
  guide_objects_token:
    file: ${WORKSPACE_GUIDE_OBJECTS_TOKEN_FILE:?Set the Assets Source Guide bearer file}
