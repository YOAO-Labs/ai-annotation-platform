required-version = "==0.15.22"
line-length = 88
target-version = "py310"
force-exclude = true
extend-exclude = [
    ".claude/worktrees",
    "generated",
    "vendor",
]

[per-file-target-version]
"apps/api/**" = "py311"
"apps/assets-media/**" = "py311"
"packages/python-sdk/**" = "py311"
"scripts/*.py" = "py311"
