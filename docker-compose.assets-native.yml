# Optional Native pyramid storage signing and caller bindings.
# Combine this file with docker-compose.assets-source.yml,
# docker-compose.assets-media.yml and docker-compose.assets-cleanup.yml.
# Source-only and non-Native media deployments omit this file and keep the
# signer disabled; Native callers never fall back to another signer or to
# configured cache credentials.
services:
  assets-source:
    environment:
      ASSETS_SOURCE_NATIVE_PYRAMID_WRITER_TOKEN_FILE: /run/secrets/assets_source_native_pyramid_writer_token
      ASSETS_SOURCE_NATIVE_PYRAMID_READER_TOKEN_FILE: /run/secrets/assets_source_native_pyramid_reader_token
      ASSETS_SOURCE_NATIVE_PYRAMID_CLEANUP_TOKEN_FILE: /run/secrets/assets_source_native_pyramid_cleanup_token
      ASSETS_SOURCE_NATIVE_S3_ACCESS_KEY_FILE: /run/secrets/assets_source_native_s3_access_key
      ASSETS_SOURCE_NATIVE_S3_SECRET_KEY_FILE: /run/secrets/assets_source_native_s3_secret_key
    secrets:
      - assets_source_native_pyramid_writer_token
      - assets_source_native_pyramid_reader_token
      - assets_source_native_pyramid_cleanup_token
      - assets_source_native_s3_access_key
      - assets_source_native_s3_secret_key

  assets-media-control:
    environment:
      ASSETS_MEDIA_NATIVE_IMAGE_STORAGE_URL: http://assets-source:8767
      ASSETS_MEDIA_NATIVE_IMAGE_STORAGE_TOKEN_FILE: /run/secrets/assets_media_native_image_storage_token
    secrets:
      - assets_media_native_image_storage_token

  assets-images-worker:
    environment:
      ASSETS_IMAGES_NATIVE_STORAGE_URL: http://assets-source:8767
      ASSETS_IMAGES_NATIVE_STORAGE_TOKEN_FILE: /run/secrets/assets_images_native_storage_token
    secrets:
      - assets_images_native_storage_token

  # API-local image executor and wake-up adapter; unused while remote media
  # control is selected, but it must hold the writer binding when it executes.
  celery-worker-image-pyramid:
    environment:
      ASSETS_IMAGES_NATIVE_STORAGE_URL: http://assets-source:8767
      ASSETS_IMAGES_NATIVE_STORAGE_TOKEN_FILE: /run/secrets/assets_images_native_storage_token
    secrets:
      - assets_images_native_storage_token

secrets:
  assets_source_native_pyramid_writer_token:
    file: ${ASSETS_SOURCE_NATIVE_PYRAMID_WRITER_TOKEN_FILE:-./.secrets/assets-source-native-pyramid-writer-token}
  assets_source_native_pyramid_reader_token:
    file: ${ASSETS_SOURCE_NATIVE_PYRAMID_READER_TOKEN_FILE:-./.secrets/assets-source-native-pyramid-reader-token}
  assets_source_native_pyramid_cleanup_token:
    file: ${ASSETS_SOURCE_NATIVE_PYRAMID_CLEANUP_TOKEN_FILE:-./.secrets/assets-source-native-pyramid-cleanup-token}
  assets_source_native_s3_access_key:
    file: ${ASSETS_SOURCE_NATIVE_S3_ACCESS_KEY_FILE:-./.secrets/assets-source-native-s3-access-key}
  assets_source_native_s3_secret_key:
    file: ${ASSETS_SOURCE_NATIVE_S3_SECRET_KEY_FILE:-./.secrets/assets-source-native-s3-secret-key}
  assets_media_native_image_storage_token:
    file: ${ASSETS_MEDIA_NATIVE_IMAGE_STORAGE_TOKEN_FILE:-./.secrets/assets-media-native-image-storage-token}
  assets_images_native_storage_token:
    file: ${ASSETS_IMAGES_NATIVE_STORAGE_TOKEN_FILE:-./.secrets/assets-images-native-storage-token}
