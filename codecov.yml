coverage:
  status:
    project:
      backend:
        target: 60%
        threshold: 1%
        flags:
          - backend
        informational: false
      frontend:
        target: 10%
        threshold: 1%
        flags:
          - frontend
        informational: false
    patch:
      backend:
        target: 70%
        flags:
          - backend
        informational: true
      frontend:
        target: 50%
        flags:
          - frontend
        informational: true

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: backend
      paths:
        - apps/api/
    - name: frontend
      paths:
        - apps/web/src/

comment:
  layout: "reach,diff,flags,tree"
  require_changes: true

ignore:
  - "apps/api/alembic/versions/*"
  - "apps/api/tests/*"
  - "apps/web/src/api/generated/*"
  - "apps/web/e2e/*"
  - "apps/web/**/*.test.ts"
  - "apps/web/**/*.test.tsx"
  - "**/*.d.ts"
