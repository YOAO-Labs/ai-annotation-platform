# ML Backend 叠加文件 · GPU 推理 backend + 截图协议 stub。
#
# 从 docker-compose.yml 拆出：这三者都是 profile-gated 的独立 HTTP 服务，
# 与核心 infra（postgres/redis/minio/celery）无 depends_on、不共享数据卷，
# 拎出来单独维护让基础栈更聚焦。
#
# 用法（与基础文件叠加，保持单一 compose project，避免 orphan 容器警告）:
#   docker compose -f docker-compose.yml -f docker-compose.ml.yml --profile gpu      up -d grounded-sam2-backend
#   docker compose -f docker-compose.yml -f docker-compose.ml.yml --profile gpu-sam3 up -d sam3-backend
#   docker compose -f docker-compose.yml -f docker-compose.ml.yml --profile gpu-yolo up -d yolo-backend
#   docker compose -f docker-compose.yml -f docker-compose.ml.yml --profile screenshots up -d screenshot-ml-stub
#
# 嫌每次敲两个 -f 麻烦, 可在 shell / .env 固化:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.ml.yml
# 之后 `docker compose --profile gpu up -d grounded-sam2-backend` 即可（profile-gated 不影响默认 `up`）。
#
# 各 backend 使用独立 profile，用户可按显存预算组合 GPU 服务，或只启动 CPU 截图 stub。
# 端口: grounded-sam2 → 8001 · sam3 → 8002 · yolo → 8003 · onnxtools → 8004 · stub → 9100。

services:
  # 截图/视觉回归专用 CPU 协议 stub。平台宿主进程与 Celery 容器都通过已发布端口访问，
  # registry URL 默认复用 ML_BACKEND_STORAGE_HOST 的主机部分并改用 9100；也可在 seed 命令覆盖。
  screenshot-ml-stub:
    build:
      context: ./docs-site/dev/examples/mock-v2-backend
    profiles: ["screenshots"]
    ports:
      - "9100:9100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:9100/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5

  # v0.9.0+ Grounded-SAM-2 ML Backend (GroundingDINO + SAM 2.1).
  # 默认 GPU profile, dev 无 GPU 笔记本不会被拉起; 启用方式:
  #   docker compose -f docker-compose.yml -f docker-compose.ml.yml --profile gpu up grounded-sam2-backend
  # 首次启动会自动下载 checkpoints (~900MB), start_period 留足 120s.
  grounded-sam2-backend:
    build:
      # v0.9.4 phase 3: build context 升级到 apps/ 以便 COPY 兄弟目录 _shared/mask_utils
      # (与 v0.10.x sam3-backend 共用 mask→polygon 简化逻辑). Dockerfile 内所有 COPY 路径
      # 已加 grounded-sam2-backend/ 前缀; 历史 `docker build apps/grounded-sam2-backend/` 失效.
      context: ./apps
      dockerfile: grounded-sam2-backend/Dockerfile
    profiles: ["gpu"]
    ports:
      - "8001:8001"
    environment:
      AAP_BACKEND_AUTH_DIR: /run/aap-inference-auth
      SAM_VARIANT: ${SAM_VARIANT:-tiny}
      DINO_VARIANT: ${DINO_VARIANT:-T}
      BOX_THRESHOLD: ${BOX_THRESHOLD:-0.35}
      TEXT_THRESHOLD: ${TEXT_THRESHOLD:-0.25}
      HF_HOME: /app/.cache/huggingface
      LOG_LEVEL: ${GSAM2_LOG_LEVEL:-INFO}
      NVIDIA_VISIBLE_DEVICES: ${GSAM2_GPU_DEVICE_ID:-0}
      AAP_GPU_PHYSICAL_DEVICE_TOKEN: ${GSAM2_GPU_DEVICE_ID:-0}
      # B-28+ · 空闲 N 秒后自动卸载模型释放显存; <=0 关闭定时卸载, 仍可手动 POST /unload.
      IDLE_UNLOAD_SECONDS: ${IDLE_UNLOAD_SECONDS:-600}
      IDLE_CHECK_INTERVAL: ${IDLE_CHECK_INTERVAL:-60}
      # v0.10.23 · ModelPool 同容器内并存的变体数上限 (LRU). 显存预算:
      #   单变体常驻 ~2-4GB (tiny/small) · large+SwinB 峰值 ~6-8GB.
      #   4060(8G) 建议 1; 3090(24G) 1-2; A100 2-4. 默认 1 = 维持单变体常驻行为.
      MODEL_POOL_CAP: ${MODEL_POOL_CAP:-1}
      # pool 满 + 并发 miss 时排队等待显存腾挪 / 同变体 build 的超时 (秒), 超时返回 503.
      MODEL_POOL_BUILD_TIMEOUT: ${MODEL_POOL_BUILD_TIMEOUT:-30}
      # v0.10.23 · entrypoint 启动时额外预拉的变体 checkpoint (主变体 SAM_VARIANT/DINO_VARIANT
      # 之外). pool 能服务多变体, 但只有这里声明 (+ 主变体) 的 checkpoint 会落盘; 运行期请求
      # 未预拉的变体会 503. 逗号分隔. 默认全量, 让 pool 任意切换不踩 checkpoint 缺失;
      # 磁盘紧张时可裁剪 (tiny~150M / small~180M / base_plus~320M / large~900M · SwinB~940M).
      PREFETCH_SAM_VARIANTS: ${PREFETCH_SAM_VARIANTS:-tiny,small,base_plus,large}
      PREFETCH_DINO_VARIANTS: ${PREFETCH_DINO_VARIANTS:-T,B}
      # v0.10.35 §B · sam2_video tracker 独立显存池 (与图片池预算分离, 互不驱逐).
      VIDEO_MODEL_POOL_CAP: ${VIDEO_MODEL_POOL_CAP:-1}
      VIDEO_MODEL_POOL_BUILD_TIMEOUT: ${VIDEO_MODEL_POOL_BUILD_TIMEOUT:-60}
      # 单次 init_state 一次性加载的最大帧数 (安全上限, 防超长窗口灌爆显存).
      VIDEO_TRACKER_MAX_WINDOW_FRAMES: ${VIDEO_TRACKER_MAX_WINDOW_FRAMES:-300}
      # 大于单窗上限时启用跨窗 session；按目标 GPU 实测后调高。
      VIDEO_TRACKER_MAX_CONTEXT_FRAMES: ${VIDEO_TRACKER_MAX_CONTEXT_FRAMES:-300}
      # video 池独立 idle 卸载 (与图片池 IDLE_UNLOAD_SECONDS 各自计时); <=0 关闭.
      VIDEO_IDLE_UNLOAD_SECONDS: ${VIDEO_IDLE_UNLOAD_SECONDS:-600}
      GPU_LIFECYCLE_VERIFY_KEYS_JSON: ${GPU_LIFECYCLE_VERIFY_KEYS_JSON:-}
      # 实卡完成 image/video/双池/full-unload 验收前保持 0，不发布 enforce 能力。
      GROUNDED_SAM2_MANAGED_LIFECYCLE_VERIFIED: ${GROUNDED_SAM2_MANAGED_LIFECYCLE_VERIFIED:-0}
    volumes:
      - type: bind
        source: ${ML_MANAGED_AUTH_DIR:-./data/inference-auth}/gsam2
        target: /run/aap-inference-auth
        read_only: true
        bind:
          create_host_path: false
      - gsam2_checkpoints:/app/checkpoints
      - gsam2_hf_cache:/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GSAM2_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # v0.10.0+ SAM 3 ML Backend (facebookresearch/sam3 + facebook/sam3.1 weights).
  # 独立 profile `gpu-sam3` (与 grounded-sam2 的 `gpu` profile 解耦, 让用户单独控制):
  #   docker compose -f docker-compose.yml -f docker-compose.ml.yml --profile gpu-sam3 up sam3-backend
  # 两个 backend 可并存; sam3 是高精度首选 (3090/A100), grounded-sam2 兜底 (4060 友好).
  # 首次启动会下载 sam3.pt + sam3.1_multiplex 权重 (合计 ~6.6GB, gated, 需 HF_TOKEN), start_period 留足 180s.
  sam3-backend:
    build:
      context: ./apps
      dockerfile: sam3-backend/Dockerfile
    profiles: ["gpu-sam3"]
    ports:
      - "8002:8002"
    environment:
      AAP_BACKEND_AUTH_DIR: /run/aap-inference-auth
      HF_TOKEN: ${HF_TOKEN}
      HF_HOME: /app/.cache/huggingface
      SAM3_DOWNLOAD_VIDEO: ${SAM3_DOWNLOAD_VIDEO:-1}
      SAM3_EMBEDDING_CACHE_SIZE: ${SAM3_EMBEDDING_CACHE_SIZE:-32}
      SAM3_SCORE_THRESHOLD: ${SAM3_SCORE_THRESHOLD:-0.5}
      LOG_LEVEL: ${SAM3_LOG_LEVEL:-INFO}
      NVIDIA_VISIBLE_DEVICES: ${SAM3_GPU_DEVICE_ID:-1}
      AAP_GPU_PHYSICAL_DEVICE_TOKEN: ${SAM3_GPU_DEVICE_ID:-1}
      # 空闲 N 秒后自动卸载模型释放显存; <=0 关闭定时卸载, 仍可手动 POST /unload.
      # sam3 (开 inst) 显存占用 ~5.8GB FP16, 与 grounded-sam2 并存时强烈建议保留 idle unload.
      # SAM3_ 前缀, 与 grounded-sam2 的 IDLE_UNLOAD_SECONDS 解耦, 两个 backend 可独立调.
      SAM3_IDLE_UNLOAD_SECONDS: ${SAM3_IDLE_UNLOAD_SECONDS:-600}
      SAM3_IDLE_CHECK_INTERVAL: ${SAM3_IDLE_CHECK_INTERVAL:-60}
      # 三个 GPU 根共享冷构建串行锁；超时只结束等待者，真实 builder 仍受 pool 跟踪。
      SAM3_MODEL_POOL_BUILD_TIMEOUT: ${SAM3_MODEL_POOL_BUILD_TIMEOUT:-120}
      # PVS 单窗与跨窗 session 上限；context 大于 window 时才声明 session capability。
      SAM3_PVS_MAX_WINDOW_FRAMES: ${SAM3_PVS_MAX_WINDOW_FRAMES:-16}
      SAM3_PVS_MAX_CONTEXT_FRAMES: ${SAM3_PVS_MAX_CONTEXT_FRAMES:-16}
      GPU_LIFECYCLE_VERIFY_KEYS_JSON: ${GPU_LIFECYCLE_VERIFY_KEYS_JSON:-}
      # image/multiplex/PVS 全池实卡验收前保持 0，不发布 enforce 能力。
      SAM3_MANAGED_LIFECYCLE_VERIFIED: ${SAM3_MANAGED_LIFECYCLE_VERIFIED:-0}
      # v0.21.19 §PR3 · sam3.1_multiplex 视频模型显存吃紧 (单卡 8GB 几乎占满), 用
      # expandable_segments 减碎片, 挤出激活空间避免 OOM (报错信息即建议此项)。
      # 注: 该模型 FP16 加载即 ~7GB, 8GB 卡前向激活仍会 OOM——需 >8GB 显存实用。
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
    volumes:
      - type: bind
        source: ${ML_MANAGED_AUTH_DIR:-./data/inference-auth}/sam3
        target: /run/aap-inference-auth
        read_only: true
        bind:
          create_host_path: false
      - sam3_checkpoints:/app/checkpoints
      - sam3_hf_cache:/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SAM3_GPU_DEVICE_ID:-1}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # v0.14.12 · yolo-backend (ultralytics 多任务多系列, det/seg/pose/obb 四 task).
  # 与 grounded-sam2 (8001) / sam3 (8002) 解耦的独立 profile:
  #   docker compose -f docker-compose.yml -f docker-compose.ml.yml --profile gpu-yolo up yolo-backend
  # 三 backend 可并存; yolo 走纯批量预标 (supported_prompts=['none']), 不挤占交互式工具栏.
  # 显存预算: 单 m/l 模型 ~5-8GB; 池容量 YOLO_MODEL_POOL_CAP 默认 2 适配 4060/3060 8G.
  # 首次推理时按需从 GH release 下载权重到 checkpoints 卷; STRICT_OFFLINE=1 改报 400.
  yolo-backend:
    build:
      context: ./apps
      dockerfile: yolo-backend/Dockerfile
    profiles: ["gpu-yolo"]
    ports:
      - "8003:8003"
    environment:
      AAP_BACKEND_AUTH_DIR: /run/aap-inference-auth
      YOLO_DEVICE: ${YOLO_DEVICE:-cuda:0}
      YOLO_MODEL_POOL_CAP: ${YOLO_MODEL_POOL_CAP:-2}
      YOLO_MANAGED_MODELS_TOKEN: ${YOLO_MANAGED_MODELS_TOKEN:-}
      YOLO_BUILD_TIMEOUT: ${YOLO_BUILD_TIMEOUT:-30}
      YOLO_IDLE_UNLOAD_SECONDS: ${YOLO_IDLE_UNLOAD_SECONDS:-600}
      YOLO_IDLE_CHECK_INTERVAL: ${YOLO_IDLE_CHECK_INTERVAL:-60}
      YOLO_STRICT_OFFLINE: ${YOLO_STRICT_OFFLINE:-0}
      YOLO_MANAGED_LIFECYCLE_VERIFIED: ${YOLO_MANAGED_LIFECYCLE_VERIFIED:-0}
      GPU_LIFECYCLE_VERIFY_KEYS_JSON: ${GPU_LIFECYCLE_VERIFY_KEYS_JSON:-}
      LOG_LEVEL: ${YOLO_LOG_LEVEL:-INFO}
      NVIDIA_VISIBLE_DEVICES: ${YOLO_GPU_DEVICE_ID:-0}
      AAP_GPU_PHYSICAL_DEVICE_TOKEN: ${YOLO_GPU_DEVICE_ID:-0}
    volumes:
      - type: bind
        source: ${ML_MANAGED_AUTH_DIR:-./data/inference-auth}/yolo
        target: /run/aap-inference-auth
        read_only: true
        bind:
          create_host_path: false
      - yolo_checkpoints:/app/checkpoints
      # Same host: use the executor's resolved path to reuse one physical blob.
      # Remote hosts prepare their own directory with the same immutable assets.
      - ${TRAINING_MODELS_PATH:-./training/models}:/model-assets:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${YOLO_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # v0.18.0 · onnxtools-backend (rtdetr 检测 + va 车辆属性, 二阶段预标).
  #   docker compose -f docker-compose.yml -f docker-compose.ml.yml --profile gpu-onnxtools up onnxtools-backend
  # 三个固定 lazy handle (pipeline/detector/va); 纯批量预标 (supported_prompts=['none']).
  # 模型由 bind mount 注入 (不打进镜像), 起栈前先复制 (见 apps/onnxtools-backend/README.md):
  #   cp /home/tyjt/Desktop/onnxtools/models/{rtdetr-2024080100,va_260612}.onnx apps/onnxtools-backend/models/
  # onnxruntime-gpu 缺 GPU/cuDNN 时自动 fallback CPU, 功能仍可用 (仅变慢).
  onnxtools-backend:
    build:
      context: ./apps
      dockerfile: onnxtools-backend/Dockerfile
    profiles: ["gpu-onnxtools"]
    ports:
      - "8004:8004"
    environment:
      AAP_BACKEND_AUTH_DIR: /run/aap-inference-auth
      ONNXTOOLS_MODEL_DIR: /app/models
      ONNXTOOLS_DET_MODEL: ${ONNXTOOLS_DET_MODEL:-rtdetr-2024080100.onnx}
      ONNXTOOLS_VA_MODEL: ${ONNXTOOLS_VA_MODEL:-va_260612.onnx}
      ONNXTOOLS_CONF_THRES: ${ONNXTOOLS_CONF_THRES:-0.5}
      ONNXTOOLS_BUILD_TIMEOUT: ${ONNXTOOLS_BUILD_TIMEOUT:-30}
      ONNXTOOLS_IDLE_UNLOAD_SECONDS: ${ONNXTOOLS_IDLE_UNLOAD_SECONDS:-600}
      ONNXTOOLS_IDLE_CHECK_INTERVAL: ${ONNXTOOLS_IDLE_CHECK_INTERVAL:-60}
      ONNXTOOLS_MANAGED_LIFECYCLE_VERIFIED: ${ONNXTOOLS_MANAGED_LIFECYCLE_VERIFIED:-0}
      GPU_LIFECYCLE_VERIFY_KEYS_JSON: ${GPU_LIFECYCLE_VERIFY_KEYS_JSON:-}
      LOG_LEVEL: ${ONNXTOOLS_LOG_LEVEL:-INFO}
      NVIDIA_VISIBLE_DEVICES: ${ONNXTOOLS_GPU_DEVICE_ID:-0}
      AAP_GPU_PHYSICAL_DEVICE_TOKEN: ${ONNXTOOLS_GPU_DEVICE_ID:-0}
    volumes:
      - type: bind
        source: ${ML_MANAGED_AUTH_DIR:-./data/inference-auth}/onnxtools
        target: /run/aap-inference-auth
        read_only: true
        bind:
          create_host_path: false
      - ./apps/onnxtools-backend/models:/app/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ONNXTOOLS_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # v0.20.0 · rapidocr-backend (RapidOCR OCR: det 原子 + rec 原子 + e2e composite).
  #   docker compose -f docker-compose.yml -f docker-compose.ml.yml --profile gpu-rapidocr up rapidocr-backend
  # 13 个 onnx 由 bind mount 注入 (不打进镜像), 起栈前先下载 (见 apps/rapidocr-backend/README.md):
  #   python3 apps/rapidocr-backend/download_models.py
  # base 与瘦身后 onnxtools 共享 nvidia/cuda cudnn9 runtime；此 profile 始终申请 NVIDIA 设备。
  # backend 的显式 CPU 模式需通过不含下方 device reservation 的独立启动方式运行。
  rapidocr-backend:
    build:
      context: ./apps
      dockerfile: rapidocr-backend/Dockerfile
    profiles: ["gpu-rapidocr"]
    ports:
      - "8005:8005"
    environment:
      AAP_BACKEND_AUTH_DIR: /run/aap-inference-auth
      RAPIDOCR_MODEL_DIR: /app/models
      RAPIDOCR_DEVICE: ${RAPIDOCR_DEVICE:-gpu}
      RAPIDOCR_POOL_CAP: ${RAPIDOCR_POOL_CAP:-3}
      RAPIDOCR_BUILD_TIMEOUT: ${RAPIDOCR_BUILD_TIMEOUT:-30}
      RAPIDOCR_IDLE_UNLOAD_SECONDS: ${RAPIDOCR_IDLE_UNLOAD_SECONDS:-600}
      RAPIDOCR_IDLE_CHECK_INTERVAL: ${RAPIDOCR_IDLE_CHECK_INTERVAL:-60}
      RAPIDOCR_MANAGED_LIFECYCLE_VERIFIED: ${RAPIDOCR_MANAGED_LIFECYCLE_VERIFIED:-0}
      GPU_LIFECYCLE_VERIFY_KEYS_JSON: ${GPU_LIFECYCLE_VERIFY_KEYS_JSON:-}
      LOG_LEVEL: ${RAPIDOCR_LOG_LEVEL:-INFO}
      NVIDIA_VISIBLE_DEVICES: ${RAPIDOCR_GPU_DEVICE_ID:-0}
      AAP_GPU_PHYSICAL_DEVICE_TOKEN: ${RAPIDOCR_GPU_DEVICE_ID:-0}
    volumes:
      - type: bind
        source: ${ML_MANAGED_AUTH_DIR:-./data/inference-auth}/rapidocr
        target: /run/aap-inference-auth
        read_only: true
        bind:
          create_host_path: false
      - ./apps/rapidocr-backend/models:/app/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${RAPIDOCR_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  gsam2_checkpoints:
  gsam2_hf_cache:
  yolo_checkpoints:
  sam3_checkpoints:
  sam3_hf_cache:
