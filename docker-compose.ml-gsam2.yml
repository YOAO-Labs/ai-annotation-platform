services:
  grounded-sam2-backend:
    image: ${GSAM2_IMAGE:?Set the accepted Grounded-SAM-2 image repository}@${GSAM2_IMAGE_DIGEST:?Set the Grounded-SAM-2 manifest digest}
    labels:
      com.aap.lifecycle-sha256: ${GSAM2_LIFECYCLE_SHA256:?Set the reviewed Grounded-SAM-2 lifecycle source SHA-256}
    profiles: ["gpu"]
    ports:
      - "8001:8001"
    environment:
      BACKEND_AUTH_DIR: /run/aap-inference-auth
      SAM_VARIANT: ${SAM_VARIANT:-tiny}
      DINO_VARIANT: ${DINO_VARIANT:-T}
      BOX_THRESHOLD: ${BOX_THRESHOLD:-0.35}
      TEXT_THRESHOLD: ${TEXT_THRESHOLD:-0.25}
      HF_HOME: /app/.cache/huggingface
      LOG_LEVEL: ${GSAM2_LOG_LEVEL:-INFO}
      NVIDIA_VISIBLE_DEVICES: ${GSAM2_GPU_DEVICE_ID:-0}
      GPU_PHYSICAL_DEVICE_TOKEN: ${GSAM2_GPU_DEVICE_ID:-0}
      IDLE_UNLOAD_SECONDS: ${IDLE_UNLOAD_SECONDS:-600}
      IDLE_CHECK_INTERVAL: ${IDLE_CHECK_INTERVAL:-60}
      MODEL_POOL_CAP: ${MODEL_POOL_CAP:-1}
      MODEL_POOL_BUILD_TIMEOUT: ${MODEL_POOL_BUILD_TIMEOUT:-30}
      VIDEO_MODEL_POOL_CAP: ${VIDEO_MODEL_POOL_CAP:-1}
      VIDEO_MODEL_POOL_BUILD_TIMEOUT: ${VIDEO_MODEL_POOL_BUILD_TIMEOUT:-60}
      VIDEO_TRACKER_MAX_WINDOW_FRAMES: ${VIDEO_TRACKER_MAX_WINDOW_FRAMES:-16}
      VIDEO_TRACKER_MAX_CONTEXT_FRAMES: ${VIDEO_TRACKER_MAX_CONTEXT_FRAMES:-64}
      VIDEO_IDLE_UNLOAD_SECONDS: ${VIDEO_IDLE_UNLOAD_SECONDS:-600}
      GPU_LIFECYCLE_VERIFY_KEYS_JSON: ${GPU_LIFECYCLE_VERIFY_KEYS_JSON:-}
      GPU_LIFECYCLE_REGISTRY_ID: ${GSAM2_GPU_LIFECYCLE_REGISTRY_ID:-}
      GPU_LIFECYCLE_RESOURCE_ID: ${GSAM2_GPU_LIFECYCLE_RESOURCE_ID:-}
      GROUNDED_SAM2_MANAGED_LIFECYCLE_VERIFIED: ${GROUNDED_SAM2_MANAGED_LIFECYCLE_VERIFIED:-0}
    volumes:
      - type: bind
        source: ${ML_MANAGED_AUTH_DIR:-./data/inference-auth}/gsam2
        target: /run/aap-inference-auth
        read_only: true
        bind:
          create_host_path: false
      - gsam2_checkpoints:/app/checkpoints
      - gsam2_hf_cache:/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GSAM2_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
volumes:
  gsam2_checkpoints:
  gsam2_hf_cache:
