global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: development

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: anno-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
        labels:
          service: anno-api

  - job_name: ml-backends
    http_sd_configs:
      - url: http://host.docker.internal:8000/api/v1/internal/metrics-targets
        refresh_interval: 30s

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
