services:
  audit-maintenance:
    build:
      context: ../..
      dockerfile: apps/audit/Dockerfile
    image: aap-audit-maintenance:local
    profiles: ["maintenance"]
    command: ["ensure-partitions"]
    restart: "no"
    environment:
      AUDIT_MAINTENANCE_DATABASE_URL: ${AUDIT_MAINTENANCE_DATABASE_URL:-}
      AUDIT_MAINTENANCE_DATABASE_URL_FILE: ${AUDIT_MAINTENANCE_DATABASE_URL_FILE:-}
      AUDIT_MAINTENANCE_ARCHIVE_S3_ENDPOINT_URL: ${AUDIT_MAINTENANCE_ARCHIVE_S3_ENDPOINT_URL:-}
      AUDIT_MAINTENANCE_ARCHIVE_S3_REGION: ${AUDIT_MAINTENANCE_ARCHIVE_S3_REGION:-us-east-1}
      AUDIT_MAINTENANCE_ARCHIVE_S3_BUCKET: ${AUDIT_MAINTENANCE_ARCHIVE_S3_BUCKET:-audit-archive}
      AUDIT_MAINTENANCE_ARCHIVE_S3_ACCESS_KEY_ID: ${AUDIT_MAINTENANCE_ARCHIVE_S3_ACCESS_KEY_ID:-}
      AUDIT_MAINTENANCE_ARCHIVE_S3_ACCESS_KEY_ID_FILE: ${AUDIT_MAINTENANCE_ARCHIVE_S3_ACCESS_KEY_ID_FILE:-}
      AUDIT_MAINTENANCE_ARCHIVE_S3_SECRET_ACCESS_KEY: ${AUDIT_MAINTENANCE_ARCHIVE_S3_SECRET_ACCESS_KEY:-}
      AUDIT_MAINTENANCE_ARCHIVE_S3_SECRET_ACCESS_KEY_FILE: ${AUDIT_MAINTENANCE_ARCHIVE_S3_SECRET_ACCESS_KEY_FILE:-}
