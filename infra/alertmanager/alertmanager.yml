global:
  smtp_smarthost: "mailpit:1025"
  smtp_from: "alertmanager@local.test"
  smtp_require_tls: false

route:
  receiver: ops-email
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: ops-email
    email_configs:
      - to: "ops@local.test"
        send_resolved: true
