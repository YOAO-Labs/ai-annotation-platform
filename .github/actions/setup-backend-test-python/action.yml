name: Set up backend test Python
description: Install the locked API test dependencies with this run's verified Plugin SDK.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install uv
      shell: bash
      run: pip install uv
    - name: Cache uv downloads
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: backend-api-uv-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock', 'apps/api/pyproject.toml') }}
        restore-keys: |
          backend-api-uv-${{ runner.os }}-
    - uses: actions/download-artifact@v4
      with:
        name: plugin-sdk-runtime
        path: .artifacts/python/plugin-sdk
    - name: Sync API test dependencies
      shell: bash
      working-directory: apps/api
      run: uv sync --locked --extra test
