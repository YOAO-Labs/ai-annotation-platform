name: E2E execution

on:
  workflow_call:
    inputs:
      matrix:
        description: "E2E suites selected by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Plan §6.6: one build per exact fingerprint (commit + build mode + lockfile
  # + OpenAPI snapshot + Node version), reused by every `built` matrix entry.
  # The fingerprint names the artifact, so a different lockfile or snapshot can
  # only fail the download, never silently reuse another build.
  build:
    name: Frontend E2E build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      needed: ${{ steps.needed.outputs.needed }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      build-seconds: ${{ steps.build.outputs.build-seconds }}
    env:
      MATRIX: ${{ inputs.matrix }}
    steps:
      - id: needed
        run: echo "needed=$(echo "$MATRIX" | jq '[.include[] | select(.built == true)] | length > 0')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.needed.outputs.needed == 'true'
      - uses: actions/setup-node@v4
        if: steps.needed.outputs.needed == 'true'
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        if: steps.needed.outputs.needed == 'true'
      - name: Compute build fingerprint
        id: fingerprint
        if: steps.needed.outputs.needed == 'true'
        run: |
          vite_env=$(printenv | grep '^VITE_' | sort | sha256sum | cut -d' ' -f1)
          dot_env=$([ -f .env ] && sha256sum .env | cut -d' ' -f1 || echo absent)
          fingerprint=$(printf '%s' "$GITHUB_SHA-e2e-$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)-$(sha256sum apps/api/openapi.snapshot.json | cut -d' ' -f1)-$(node --version)-$vite_env-$dot_env" | sha256sum | cut -d' ' -f1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: pnpm install
        if: steps.needed.outputs.needed == 'true'
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - id: build
        name: Build frontend
        if: steps.needed.outputs.needed == 'true'
        working-directory: apps/web
        env:
          OPENAPI_URL: ${{ github.workspace }}/apps/api/openapi.snapshot.json
        run: |
          start=$(date +%s)
          pnpm build --mode e2e
          echo "build-seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
      - name: Upload dist artifact
        if: steps.needed.outputs.needed == 'true'
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: |
          tar -czf "web-e2e-dist-$FINGERPRINT.tar.gz" -C apps/web dist
          sha256sum "web-e2e-dist-$FINGERPRINT.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: steps.needed.outputs.needed == 'true'
        with:
          name: web-e2e-dist-${{ steps.fingerprint.outputs.fingerprint }}
          path: |
            web-e2e-dist-*.tar.gz
            SHA256SUMS
          retention-days: 3

  suites:
    name: Frontend E2E suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fail-closed via the needs dependency: a failed shared build skips every
    # suite (the aggregate Frontend E2E then fails on the skipped result);
    # `skipped` is only legitimate when no built suite was selected at all.
    needs: [build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    # Each runner owns its services; never parallelize workers against shared fixtures.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: annotation_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/annotation_test
      PLAYWRIGHT_E2E_DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/annotation_test
      SECRET_KEY: ci-test-secret
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: annotations-test
      # The test router is opt-in and also validates the _test database suffix.
      E2E_SEED_ENABLED: "true"
      ENVIRONMENT: development
      # CI 上 Node 把 localhost 解析成 ::1，但 uvicorn --host 0.0.0.0 只听 IPv4，
      # 用 127.0.0.1 强制 IPv4 避免 ECONNREFUSED ::1:8000。
      PLAYWRIGHT_API_BASE: http://127.0.0.1:8000
    steps:
      - name: Record prep start
        run: echo "E2E_PREP_START=$(date +%s)" >> "$GITHUB_ENV"
      # Fail-closed: a built entry never runs without its fingerprinted build,
      # and a build failure skips the suites instead of testing stale code.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install uv
        run: pip install uv
      - name: Sync API deps
        working-directory: apps/api
        run: uv sync --extra test
      # The services block cannot pass MinIO's `server` subcommand, so start the
      # pinned image with docker run and wait for its health endpoint; this
      # keeps FastAPI startup from racing the container's readiness window.
      # IBM mirror preserves the digest: https://www.ibm.com/support/pages/node/7289585
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            icr.io/fusion-open/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          docker logs minio
          exit 1
      - name: alembic upgrade head
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: Start FastAPI in background
        if: matrix.built
        working-directory: apps/api
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 > "$GITHUB_WORKSPACE/apps/web/e2e-api.log" 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health/db; then exit 0; fi
            sleep 1
          done
          cat "$GITHUB_WORKSPACE/apps/web/e2e-api.log"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - name: pnpm install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Generate API types for Mask suites
        if: matrix.built != true
        working-directory: apps/web
        env:
          OPENAPI_URL: ${{ github.workspace }}/apps/api/openapi.snapshot.json
        run: pnpm codegen
      # Fail-closed: the download only succeeds for the exact fingerprint
      # because the artifact name embeds it.
      - uses: actions/download-artifact@v4
        if: matrix.built == true
        with:
          name: web-e2e-dist-${{ needs.build.outputs.fingerprint }}
          path: shared-build
      - name: Verify and unpack shared build
        if: matrix.built == true
        working-directory: shared-build
        env:
          FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
        run: |
          set -euo pipefail
          # SHA256SUMS is produced by the build job from the real archive bytes;
          # fail if it does not name exactly the requested fingerprinted archive.
          grep -F "web-e2e-dist-$FINGERPRINT.tar.gz" SHA256SUMS | sha256sum -c -
          # Adversarial extra: reject a checksums file naming any other archive.
          if ! diff <(grep -F "web-e2e-dist-$FINGERPRINT.tar.gz" SHA256SUMS) SHA256SUMS; then
            echo "::error::checksum manifest names archives beyond the requested fingerprint"
            exit 1
          fi
          tar -xzf "web-e2e-dist-$FINGERPRINT.tar.gz" -C "$GITHUB_WORKSPACE/apps/web"
      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E suite
        id: e2e
        timeout-minutes: 20
        working-directory: apps/web
        run: |
          echo "E2E_PREP_SECONDS=$(( $(date +%s) - E2E_PREP_START ))" >> "$GITHUB_ENV"
          echo "E2E_RUN_START=$(date +%s)" >> "$GITHUB_ENV"
          pnpm ${{ matrix.command }}
      - name: Record execution seconds
        if: always() && steps.e2e.outcome != 'skipped'
        run: echo "E2E_RUN_SECONDS=$(( $(date +%s) - E2E_RUN_START ))" >> "$GITHUB_ENV"
      - name: Summarize E2E results
        if: always()
        env:
          E2E_SUITE: ${{ matrix.suite }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          E2E_BUILD_SECONDS: ${{ needs.build.outputs.build-seconds }}
          E2E_STATUS_OUT: apps/web/suite-status/${{ matrix.suite }}.json
        run: |
          mkdir -p apps/web/suite-status
          node scripts/summarize-e2e-results.mjs "$E2E_SUITE" "$E2E_OUTCOME" apps/web/e2e-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.suite }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/e2e-results.json
            apps/web/suite-status/
            apps/web/e2e-api.log
          retention-days: 7
