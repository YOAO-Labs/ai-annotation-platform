name: E2E execution

on:
  workflow_call:
    inputs:
      matrix:
        description: "E2E suites selected by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Frontend E2E build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      needed: ${{ steps.needed.outputs.needed }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      build-seconds: ${{ steps.build.outputs.build-seconds }}
    env:
      MATRIX: ${{ inputs.matrix }}
    steps:
      - id: needed
        run: echo "needed=$(echo "$MATRIX" | jq '[.include[] | select(.built == true)] | length > 0')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.needed.outputs.needed == 'true'
      - uses: actions/setup-node@v4
        if: steps.needed.outputs.needed == 'true'
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        if: steps.needed.outputs.needed == 'true'
      - name: Compute build fingerprint
        id: fingerprint
        if: steps.needed.outputs.needed == 'true'
        run: |
          vite_env=$(printenv | grep '^VITE_' | sort | sha256sum | cut -d' ' -f1)
          dot_env=$([ -f .env ] && sha256sum .env | cut -d' ' -f1 || echo absent)
          fingerprint=$(printf '%s' "$GITHUB_SHA-e2e-$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)-$(sha256sum apps/api/openapi.snapshot.json | cut -d' ' -f1)-$(node --version)-$vite_env-$dot_env" | sha256sum | cut -d' ' -f1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: pnpm install
        if: steps.needed.outputs.needed == 'true'
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - id: build
        name: Build frontend
        if: steps.needed.outputs.needed == 'true'
        working-directory: apps/web
        env:
          OPENAPI_URL: ${{ github.workspace }}/apps/api/openapi.snapshot.json
        run: |
          start=$(date +%s)
          pnpm build --mode e2e
          echo "build-seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
      - name: Upload dist artifact
        if: steps.needed.outputs.needed == 'true'
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: |
          tar -czf "web-e2e-dist-$FINGERPRINT.tar.gz" -C apps/web dist
          sha256sum "web-e2e-dist-$FINGERPRINT.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: steps.needed.outputs.needed == 'true'
        with:
          name: web-e2e-dist-${{ steps.fingerprint.outputs.fingerprint }}
          path: |
            web-e2e-dist-${{ steps.fingerprint.outputs.fingerprint }}.tar.gz
            SHA256SUMS
          retention-days: 3

  suites:
    name: Frontend E2E suites
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [build]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix: ${{ fromJSON(inputs.matrix) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://user:pass@127.0.0.1:5432/postgres
      SECRET_KEY: ci-test-secret
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      ENVIRONMENT: development
      UV_FROZEN: "1"
      PLAYWRIGHT_CHROMIUM_CHANNEL: ${{ (startsWith(matrix.suite, 'default-') || startsWith(matrix.suite, 'video-pipeline-') || matrix.suite == 'mask-toolbar-native' || matrix.suite == 'ai-request-worker') && 'chrome' || '' }}
      E2E_MINIO_PROJECT: e2e-minio-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
    steps:
      - name: Record prep start
        run: echo "E2E_PREP_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native runtime dependencies
        run: |
          packages=()
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            packages+=(ffmpeg)
          fi
          if ! command -v vips >/dev/null; then
            packages+=(libvips-tools)
          fi
          if [ ! -f /usr/share/color/icc/sRGB.icc ] && [ ! -f /usr/share/color/icc/sRGB.icm ] &&
             [ ! -f /usr/share/color/icc/colord/sRGB.icc ]; then
            packages+=(icc-profiles-free)
          fi
          if ! docker compose version >/dev/null 2>&1; then
            packages+=(docker-compose-v2)
          fi
          if [ "${#packages[@]}" -gt 0 ]; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
          ffmpeg -version
          ffprobe -version
          vips --version
          docker compose version
      - name: Install uv
        run: pip install uv
      - name: Sync API deps
        run: uv sync --project apps/api --frozen --no-dev --python 3.11
      - name: Start MinIO
        id: minio
        run: |
          minio=(docker compose --project-name "$E2E_MINIO_PROJECT" --file .github/e2e-minio.yml)
          for attempt in 1 2 3; do
            if "${minio[@]}" pull minio; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$((attempt * 5))"
          done
          if ! "${minio[@]}" up --detach --pull never --wait --wait-timeout 30 minio; then
            "${minio[@]}" logs minio
            exit 1
          fi
      - name: Prepare pinned MinIO client
        run: |
          mkdir -p "$RUNNER_TEMP/minio-client"
          docker compose --project-name "$E2E_MINIO_PROJECT" --file .github/e2e-minio.yml \
            cp minio:/usr/bin/mc "$RUNNER_TEMP/minio-client/mc"
          chmod 700 "$RUNNER_TEMP/minio-client/mc"
          "$RUNNER_TEMP/minio-client/mc" --version
          echo "$RUNNER_TEMP/minio-client" >> "$GITHUB_PATH"
      - name: Cache native raster PostgreSQL image
        if: matrix.suite == 'mask-native' || matrix.suite == 'mask-native-editor'
        run: |
          postgres_image=postgres@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
          docker pull --platform linux/amd64 "$postgres_image"
          docker tag "$postgres_image" postgres:16-alpine
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - name: pnpm install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Generate API types for Mask suites
        if: matrix.built != true
        working-directory: apps/web
        env:
          OPENAPI_URL: ${{ github.workspace }}/apps/api/openapi.snapshot.json
        run: pnpm codegen
      - uses: actions/download-artifact@v4
        if: matrix.built == true
        with:
          name: web-e2e-dist-${{ needs.build.outputs.fingerprint }}
          path: shared-build
      - name: Verify and unpack shared build
        if: matrix.built == true
        working-directory: shared-build
        env:
          FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
        run: node "$GITHUB_WORKSPACE/scripts/unpack-e2e-build.mjs" "$FINGERPRINT" "$GITHUB_WORKSPACE/apps/web"
      - name: Install Playwright browser
        working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps "${PLAYWRIGHT_CHROMIUM_CHANNEL:-chromium}"
          if [ "$PLAYWRIGHT_CHROMIUM_CHANNEL" = chrome ]; then
            google-chrome --version
            if [[ "${{ matrix.suite }}" == default-* ]]; then
              pnpm exec playwright install chromium
            fi
          fi
      - name: Run E2E suite
        id: e2e
        timeout-minutes: 30
        run: |
          echo "E2E_PREP_SECONDS=$(( $(date +%s) - E2E_PREP_START ))" >> "$GITHUB_ENV"
          echo "E2E_RUN_START=$(date +%s)" >> "$GITHUB_ENV"
          if [ "${{ matrix.suite }}" = "ai-request-worker" ]; then
            PLAYWRIGHT_AI_REQUEST_WORKER=1 PREANNOTATE_GPU_QUEUE=ml.cpu PREANNOTATE_CPU_QUEUE=ml.cpu \
              pnpm dev:worktree -- exec --mode e2e --with-worker -- pnpm --filter web ${{ matrix.command }}
          elif [ "${{ matrix.suite }}" = "mask-native" ] || [ "${{ matrix.suite }}" = "mask-native-editor" ]; then
            pnpm --filter web ${{ matrix.command }}
          else
            pnpm dev:worktree -- exec --mode e2e -- pnpm --filter web ${{ matrix.command }}
          fi
      - name: Record execution seconds
        if: always() && steps.e2e.outcome != 'skipped'
        run: echo "E2E_RUN_SECONDS=$(( $(date +%s) - E2E_RUN_START ))" >> "$GITHUB_ENV"
      - name: Retire E2E MinIO
        if: always() && steps.minio.outcome != 'skipped'
        run: docker compose --project-name "$E2E_MINIO_PROJECT" --file .github/e2e-minio.yml down --volumes
      - name: Summarize E2E results
        if: always()
        env:
          E2E_SUITE: ${{ matrix.suite }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          E2E_BUILD_SECONDS: ${{ needs.build.outputs.build-seconds }}
          E2E_REQUIRE_ALL_TESTS: ${{ (matrix.requireAllTests || matrix.suite == 'mask-native' || matrix.suite == 'mask-native-editor' || matrix.suite == 'mask-readonly') && '1' || '0' }}
          E2E_STATUS_OUT: apps/web/suite-status/${{ matrix.suite }}.json
        run: |
          mkdir -p apps/web/suite-status
          status=0
          node scripts/summarize-e2e-results.mjs "$E2E_SUITE" "$E2E_OUTCOME" apps/web/e2e-results.json || status=$?
          if [ "$E2E_SUITE" = "mask-native" ]; then
            E2E_REQUIRE_ALL_TESTS=1 E2E_STATUS_OUT=apps/web/suite-status/mask-worker.json \
              node scripts/summarize-e2e-results.mjs mask-worker "$E2E_OUTCOME" apps/web/e2e-browser-integration-results.json || status=$?
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.suite }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/e2e-results.json
            apps/web/e2e-browser-integration-results.json
            apps/web/suite-status/
            apps/web/e2e-api.log
          retention-days: 7
