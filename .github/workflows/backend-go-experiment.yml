name: Backend audit experiment

on:
  workflow_dispatch:

jobs:
  audit-summary-experiment:
    name: Backend audit experiment validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/audit-summary/go.mod
          cache: false
      - name: Go experiment tests and vet
        working-directory: apps/audit-summary
        run: |
          go test -race ./...
          go vet ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Stage verified Plugin-SDK artifacts
        env:
          PLUGIN_SDK_MANIFEST: ${{ vars.YOAO_SDK_MANIFEST }}
          PLUGIN_SDK_SHA256: ${{ vars.YOAO_SDK_MANIFEST_SHA256 }}
        run: python scripts/fetch-python-artifacts.py --manifest "$PLUGIN_SDK_MANIFEST" --sha256 "$PLUGIN_SDK_SHA256" --output .artifacts/python/plugin-sdk --package yoao-backend-runtime
      - name: API experiment transport tests
        working-directory: apps/api
        run: |
          uv sync --locked --extra test
          uv run pytest -q experiments/tests
