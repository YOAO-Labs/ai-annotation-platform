name: Documentation

on:
  pull_request:
    paths:
      - "docs-site/**"
      - "docs/**"
      - "apps/api/openapi.snapshot.json"
      - "apps/web/e2e/screenshots/**"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "ROADMAP/**"
      - "scripts/check-dead-links.mjs"
      - ".github/workflows/docs-validate.yml"
      # 生成文档的真值来源:改了它们但忘了重新生成,本工作流的 check:codegen 拦住
      - "apps/api/app/api/v1/**"
      - "apps/web/src/pages/Workbench/state/hotkeys.ts"
      - "apps/web/src/pages/Workbench/state/workbenchSettingsFields.ts"
      - "apps/web/src/api/auth.ts"
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/**"
      - "apps/api/openapi.snapshot.json"
      - "apps/web/e2e/screenshots/**"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "ROADMAP/**"
      - "scripts/check-dead-links.mjs"
      - "apps/api/app/api/v1/**"
      - "apps/web/src/pages/Workbench/state/hotkeys.ts"
      - "apps/web/src/pages/Workbench/state/workbenchSettingsFields.ts"
      - "apps/web/src/api/auth.ts"

permissions:
  contents: read

jobs:
  validate:
    name: Docs validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要 tag 用于 changelog 校验
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Snippet anchor consistency
        run: pnpm --filter @anno/docs-site check:snippets

      - name: ADR numbering & status
        run: pnpm --filter @anno/docs-site check:adr

      - name: Plans freshness (warning only)
        run: pnpm --filter @anno/docs-site check:plans

      - name: CHANGELOG vs git tag (warning only)
        run: pnpm --filter @anno/docs-site check:changelog

      - name: Generated docs in sync with code (hotkeys + settings + API routes)
        run: pnpm --filter @anno/docs-site check:codegen

      - name: Frontmatter metadata
        run: pnpm --filter @anno/docs-site check:frontmatter

      - name: Freshness report (advisory)
        run: pnpm --filter @anno/docs-site check:freshness

      - name: Navigation coverage
        run: pnpm --filter @anno/docs-site check:navigation -- --strict

      # 死链检查前先物化 build 期生成的链接目标（public/openapi.json 由 sync-openapi
      # 生成、docs-site/dev/adr/ 由 mirror-adr 从 docs/adr/ 镜像），否则指向这些生成物的
      # 合法链接（api/index.md 的 openapi 下载、dev/index.md 的 ADR 列表）会被误报为死链。
      - name: Materialize generated link targets (openapi + ADR mirror)
        run: |
          node docs-site/scripts/sync-openapi.mjs
          node docs-site/scripts/mirror-adr.mjs

      - name: Internal Markdown links
        run: node scripts/check-dead-links.mjs docs-site

      - name: User-guide image coverage
        run: node docs-site/scripts/check-image-manifest.mjs --strict && node docs-site/scripts/check-orphan-images.mjs --strict

      - name: Media audit policy tests
        run: pnpm --filter @anno/docs-site media:test

      # Review freshness belongs to manual acceptance, not each PR.
      - name: Published media integrity
        run: pnpm --filter @anno/docs-site media:audit -- --integrity

      - name: Excalidraw diagram integrity
        run: pnpm --filter @anno/docs-site check:diagrams

      - name: Build docs site (catches broken links via VitePress)
        env:
          DOCS_BASE: /ai-annotation-platform/
        run: pnpm --filter @anno/docs-site build

      # 链接外链校验：仅在 main 推送时跑（PR 不卡）
      - name: Link check (lychee)
        if: github.event_name == 'push'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --exclude-loopback 'docs-site/**/*.md' 'docs/**/*.md' 'README.md' 'DEV.md' 'CHANGELOG.md'
          fail: false
