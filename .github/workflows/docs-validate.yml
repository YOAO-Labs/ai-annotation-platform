name: Documentation

on:
  workflow_call:
  pull_request:
    branches-ignore: [dev, "ci/**"]
    paths:
      - "docs/**"
      - "DEV.md"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "ROADMAP/**"
      - "scripts/check-dead-links.mjs"
      - "scripts/check-adr.mjs"
      - "scripts/check-plans-freshness.mjs"
      - "scripts/check-changelog-version.mjs"
      - ".github/actions/validate-repository-docs/**"
      - ".github/workflows/docs-validate.yml"
  push:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "DEV.md"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "ROADMAP/**"
      - "scripts/check-dead-links.mjs"
      - "scripts/check-adr.mjs"
      - "scripts/check-plans-freshness.mjs"
      - "scripts/check-changelog-version.mjs"
      - ".github/actions/validate-repository-docs/**"
      - ".github/workflows/docs-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Docs validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/validate-repository-docs
