name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "DEV.md"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "ROADMAP/**"
      - "scripts/check-dead-links.mjs"
      - "scripts/check-adr.mjs"
      - "scripts/check-plans-freshness.mjs"
      - "scripts/check-changelog-version.mjs"
      - ".github/workflows/docs-validate.yml"
  push:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "DEV.md"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "ROADMAP/**"
      - "scripts/check-dead-links.mjs"
      - "scripts/check-adr.mjs"
      - "scripts/check-plans-freshness.mjs"
      - "scripts/check-changelog-version.mjs"
      - ".github/workflows/docs-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Docs validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ADR numbering and status
        run: node scripts/check-adr.mjs

      - name: Plans freshness
        run: node scripts/check-plans-freshness.mjs

      - name: Changelog vs git tag
        run: node scripts/check-changelog-version.mjs

      - name: Internal Markdown links
        run: node scripts/check-dead-links.mjs docs
