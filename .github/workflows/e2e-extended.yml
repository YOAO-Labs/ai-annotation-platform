name: E2E extended

on:
  schedule:
    # Nightly full verification (plan §6.2). The scope is passed explicitly
    # below instead of being implied by the event name.
    - cron: "0 19 * * *" # 03:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      scope:
        description: "E2E scope for the manual run"
        required: false
        default: extended
        type: choice
        options:
          - extended
          - full

permissions:
  contents: read

concurrency:
  group: e2e-extended-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Frontend extended planning
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      required: ${{ steps.plan.outputs.required }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Select suites for the requested scope
        id: plan
        env:
          E2E_SCHEDULE_SCOPE: ${{ github.event_name == 'schedule' && 'full' || '' }}
          E2E_DISPATCH_SCOPE: ${{ inputs.scope }}
        run: node scripts/plan-e2e-suites.mjs >> "$GITHUB_OUTPUT"

  suites:
    name: Frontend extended execution
    needs: [plan]
    uses: ./.github/workflows/e2e-run.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix }}

  audit:
    name: Frontend extended audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    needs: [plan, suites]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Collect latest per-suite status artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" | jq -r -f scripts/select-e2e-report-artifacts.jq)
          IFS=',' read -r -a artifact_ids <<< "$ids"
          archive=$(mktemp)
          trap 'rm -f "$archive"' EXIT
          mkdir -p suite-status-raw/suite-status
          for artifact_id in "${artifact_ids[@]}"; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$archive"
            unzip -joq "$archive" 'suite-status/*.json' -d suite-status-raw/suite-status
          done
      - name: Audit planned suites against actual results
        if: needs.plan.outputs.required != ''
        env:
          E2E_REQUIRED: ${{ needs.plan.outputs.required }}
        run: |
          printf '%s' "$E2E_REQUIRED" > required-suites.json
          node scripts/audit-e2e-requirements.mjs required-suites.json suite-status-raw/suite-status
      - name: Require every planned E2E suite to pass
        env:
          E2E_PLAN_RESULT: ${{ needs.plan.result }}
          E2E_SUITES_RESULT: ${{ needs.suites.result }}
        run: |
          test "$E2E_PLAN_RESULT" = success
          test "$E2E_SUITES_RESULT" = success
