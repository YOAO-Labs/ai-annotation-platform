name: Media review

on:
  schedule:
    # Monday 11:17 Asia/Shanghai; advisory report only.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Docs media audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit published media
        run: pnpm --filter @anno/docs-site media:audit -- --output ../.artifacts/docs-media-audit.json
      - name: Upload audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-media-audit
          path: .artifacts/docs-media-audit.json
          retention-days: 30
