name: Browser checks

# M4 · 视觉回归 CI
# 触发：每周一 01:00 UTC cron + 手动 dispatch
# 目的：捕捉 UI 偷改导致文档截图陈旧

on:
  schedule:
    - cron: "0 1 * * 1" # 每周一 01:00 UTC
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "更新基线截图（--update-snapshots）"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: visual-regression
  cancel-in-progress: false

jobs:
  regression:
    name: Frontend visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install screenshot media dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Playwright browsers
        run: pnpm --filter @anno/web exec playwright install --with-deps chromium

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install Python deps
        working-directory: apps/api
        run: uv sync

      - name: Start screenshot infrastructure
        env:
          POSTGRES_DB: annotation_screenshots_test
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.ml.yml
          --profile screenshots up -d --build --wait
          postgres redis minio screenshot-ml-stub

      - name: Run DB migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/annotation_screenshots_test
        run: uv run alembic upgrade head

      - name: Initialize MinIO buckets
        working-directory: apps/api
        # Seeding uploads media before the API lifespan can create these buckets.
        run: uv run python -c "from app.services.storage import storage_service; storage_service.ensure_all_buckets()"

      - name: Seed screenshot catalog
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/annotation_screenshots_test
          ENVIRONMENT: development
          MINIO_PUBLIC_URL: /minio
        run: >-
          PYTHONPATH=. uv run python scripts/seed.py
          --profile screenshots --repair --ml-backend-mode stub

      - name: Start API server
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/annotation_screenshots_test
          REDIS_URL: redis://localhost:6379
          ENVIRONMENT: development
          E2E_SEED_ENABLED: "true"
          SECRET_KEY: ci-secret-key-not-for-prod
          MINIO_PUBLIC_URL: /minio
        run: |
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/visual-api.log 2>&1 &
          # This screenshot stack has no Celery workers; /health checks them too.
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8000/health/db && exit 0
            sleep 1
          done
          cat /tmp/visual-api.log
          exit 1

      - name: Build frontend
        working-directory: apps/web
        run: pnpm build

      - name: Start built web preview
        working-directory: apps/web
        run: |
          nohup pnpm preview --host 127.0.0.1 --port 3000 --strictPort >/tmp/visual-web.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:3000/login && exit 0
            sleep 1
          done
          cat /tmp/visual-web.log
          exit 1

      - name: Run visual regression
        id: visual_regression
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_BASE: http://localhost:8000
        run: |
          if [ "${{ inputs.update_snapshots }}" = "true" ]; then
            pnpm screenshots:regression:update
          else
            pnpm screenshots:regression
          fi

      - name: Upload updated baselines
        if: inputs.update_snapshots == true
        uses: actions/upload-artifact@v4
        with:
          name: regression-baseline-${{ github.run_id }}
          path: apps/web/e2e/screenshots/regression/__screenshots__/
          retention-days: 14

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diff-${{ github.run_id }}
          path: |
            apps/web/test-results/
            apps/web/e2e/screenshots/regression/__screenshots__/
            /tmp/visual-api.log
            /tmp/visual-web.log
          retention-days: 14

      - name: Check image manifest
        run: node docs-site/scripts/check-image-manifest.mjs --strict

      - name: Check orphan images
        run: node docs-site/scripts/check-orphan-images.mjs --strict

      - name: Stop screenshot infrastructure
        if: always()
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.ml.yml
          --profile screenshots down -v

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          REGRESSION_OUTCOME: ${{ steps.visual_regression.outcome }}
        with:
          script: |
            const outcome = process.env.REGRESSION_OUTCOME;
            const summary = outcome === "failure"
              ? "视觉回归测试失败，请检查测试日志及 diff artifacts；测试失败不一定代表截图差异。"
              : outcome === "success"
                ? "视觉回归测试已通过，但后续检查或清理步骤失败，请检查工作流日志。"
                : "视觉回归测试未完成，请先检查依赖安装、数据初始化和服务启动日志。";
            const title = `[Visual Regression] 工作流失败 — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              summary,
              "",
              `- Run: ${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ...(outcome === "failure" ? [
                "- 仅在确认截图差异属于预期 UI 变更后，运行 `pnpm screenshots:regression:update`，",
                "  然后提交 `apps/web/e2e/screenshots/regression/__screenshots__/` 目录变更。",
              ] : []),
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["visual-regression", "documentation"],
            });
