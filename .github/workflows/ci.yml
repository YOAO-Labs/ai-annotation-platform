name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, "ci/**"]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      e2e_scope:
        description: "E2E scope for the manual run"
        required: false
        default: extended
        type: choice
        options: [extended, full]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: CI scope
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.route.outputs.plan }}
      receipt: ${{ steps.route.outputs.id }}
      full: ${{ steps.route.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select checks using the base policy
        id: route
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GROUP: ${{ github.event.merge_group.head_sha }}
          CUTOVER: ${{ vars.CI_AFFECTED_ONLY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          plan='{"scope":"full","reason":"Non-PR event","docs":false,"web":[],"api":[]}'
          full=true
          if [[ $GITHUB_EVENT_NAME == merge_group ]]; then
            test "$GROUP" = "$GITHUB_SHA"
          elif [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            test "$(git rev-parse HEAD^1)" = "$BASE"
            test "$(git rev-parse HEAD^2)" = "$HEAD"
            if git cat-file -e "$BASE:scripts/plan-affected-pr.mjs"; then
              policy=$(mktemp -d)
              for file in plan-affected-pr.mjs affected-pr-python.py test-suites.json; do
                git show "$BASE:scripts/$file" > "$policy/$file"
              done
              plan=$(node "$policy/plan-affected-pr.mjs" "$BASE" "$GITHUB_SHA" | jq -ce .)
            else
              plan=$(jq -c '.reason="Base predates the affected-check policy"' <<< "$plan")
            fi
            case $(jq -er .scope <<< "$plan") in
              affected)
                if [[ $GITHUB_BASE_REF != dev ]]; then
                  full=false
                elif [[ $CUTOVER == true ]]; then
                  if gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/rules/branches/dev" | jq -e '
                    add | any(.type == "merge_queue") and any(.type == "required_status_checks" and
                      any(.parameters.required_status_checks[]; .context == "CI verdict" and .integration_id == 15368))' >/dev/null; then
                    full=false
                  else
                    echo '::warning::Cannot confirm the dev merge queue and required Actions verdict; retaining full CI.'
                  fi
                fi ;;
              full) ;;
              *) exit 1 ;;
            esac
          fi
          printf 'plan=%s\nfull=%s\n' "$plan" "$full" >> "$GITHUB_OUTPUT"
          echo "id=$GITHUB_SHA/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'Base `%s` · tested `%s` · attempt `%s` · run full suite: `%s`\n\n' "$BASE" "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT" "$full" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"```json\n" + tojson + "\n```"' <<< "$plan" >> "$GITHUB_STEP_SUMMARY"

  affected:
    name: CI affected
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).scope == 'affected'
    runs-on: ubuntu-latest
    outputs:
      receipt: ${{ steps.receipt.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/run-affected
        with:
          plan: ${{ needs.plan.outputs.plan }}
          base: ${{ github.event.pull_request.base.sha }}
          manifest: ${{ vars.YOAO_SDK_MANIFEST }}
          manifest-sha256: ${{ vars.YOAO_SDK_MANIFEST_SHA256 }}
      - id: receipt
        run: echo "id=$GITHUB_SHA/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  full:
    name: CI full suite
    needs: plan
    if: needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/ci-full.yml
    with:
      e2e_scope: ${{ inputs.e2e_scope || 'extended' }}
      force-full: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && fromJSON(needs.plan.outputs.plan).scope == 'full') }}
      check-docs: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && fromJSON(needs.plan.outputs.plan).scope == 'full') }}

  verdict:
    name: CI verdict
    if: always()
    needs: [plan, affected, full]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_RECEIPT: ${{ needs.plan.outputs.receipt }}
          PLAN: ${{ needs.plan.outputs.plan }}
          FULL: ${{ needs.plan.outputs.full }}
          FULL_RESULT: ${{ needs.full.result }}
          AFFECTED_RESULT: ${{ needs.affected.result }}
          RECEIPT: ${{ needs.affected.outputs.receipt }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          if [[ $PLAN_RECEIPT != "$GITHUB_SHA/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" ]]; then
            echo '::error::Rerun all jobs to collect evidence for this attempt.'
            exit 1
          fi
          scope=$(jq -er .scope <<< "$PLAN")
          case "$scope/$FULL" in
            full/true) test "$AFFECTED_RESULT" = skipped ;;
            affected/true|affected/false)
              test "$GITHUB_EVENT_NAME" = pull_request
              test "$AFFECTED_RESULT" = success
              test "$RECEIPT" = "$GITHUB_SHA/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" ;;
            *) exit 1 ;;
          esac
          if [[ $FULL == true ]]; then test "$FULL_RESULT" = success; else test "$FULL_RESULT" = skipped; fi
          printf 'Tested `%s` · scope `%s` · affected `%s` · full `%s`\n' "$GITHUB_SHA" "$scope" "$AFFECTED_RESULT" "$FULL_RESULT" >> "$GITHUB_STEP_SUMMARY"
