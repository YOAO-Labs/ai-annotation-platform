name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Plan §6.5-5: the manual entry states its scope explicitly instead of
      # implying one from the event name. The planned selection honours it;
      # the legacy rollback mode keeps its extended-only behavior.
      e2e_scope:
        description: "E2E scope for the manual run (shadow report)"
        required: false
        default: extended
        type: choice
        options:
          - extended
          - full

# Cancel superseded PR runs; retain every main-branch validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: annotation_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/annotation_test
      TEST_DATABASE_URL: postgresql+asyncpg://user:pass@localhost:5432/annotation_test
      # Some pytest modules import the API router during collection. Enable the
      # guarded test-only router before the first application import.
      E2E_SEED_ENABLED: "true"
      SECRET_KEY: ci-test-secret
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: annotations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install uv
        run: pip install uv
      - name: Sync deps
        working-directory: apps/api
        run: uv sync --extra test
      - name: Worktree runtime and setup tests
        working-directory: apps/api
        run: |
          uv run python -m unittest discover -s ../../scripts -p 'test_worktree*.py' -v
          uv run python ../../scripts/test-orca-worktree-setup.py
      - name: Local service maintenance tests
        working-directory: apps/api
        run: |
          uv run python ../../scripts/test_production_health_recover.py
          uv run python ../../scripts/test_development_restart.py
      # IBM mirrors the removed Quay image with the same verified digest.
      # https://www.ibm.com/support/pages/node/7289585
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            icr.io/fusion-open/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs minio
          exit 1
      - name: Initialize MinIO buckets
        working-directory: apps/api
        run: uv run python -c "from app.services.storage import storage_service; storage_service.ensure_all_buckets()"
      - name: Worktree resource isolation acceptance
        working-directory: apps/api
        run: uv run python ../../scripts/verify_worktree_isolation.py -v
      - name: alembic upgrade head
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: Migration validation (fresh / reversible / forward / restore)
        working-directory: apps/api
        env:
          AAP_MIGRATION_VALIDATION_OWNER: ci:${{ github.run_id }}
          MIGRATION_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: uv run python ../../scripts/validate_migrations.py
      - name: OpenAPI snapshot drift check
        working-directory: apps/api
        run: |
          if ! uv run python ../../scripts/export_openapi.py --check; then
            echo "::error::OpenAPI snapshot drift. 请在 apps/api 下运行 'uv run python ../../scripts/export_openapi.py' 重生 snapshot 并提交（建议本地装 pre-commit 让它自动跑）。"
            exit 1
          fi
      - name: pytest with coverage
        working-directory: apps/api
        run: >-
          uv run pytest -q --cov=app --cov-report=xml --cov-report=term-missing
          --durations=30 --junitxml=pytest-results.xml
      # P6 交接：migration policy 纯规则测试（scripts/ 下不被 apps/api pytest
      # 收集），在此以同一 venv 显式运行。
      - name: Migration policy pure tests
        working-directory: apps/api
        run: uv run python ../../scripts/test_alembic_migration_policy.py
      - name: Upload backend test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: apps/api/pytest-results.xml
          retention-days: 7
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: apps/api/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # 示例 ML backend contract tests 保活：防 docs-site/dev/examples 与协议文档脱节。
  examples-pytest:
    name: ML examples tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: echo-ml-backend contract tests
        working-directory: docs-site/dev/examples/echo-ml-backend
        run: uv run --extra test pytest -q
      - name: mock-v2-backend contract tests
        working-directory: docs-site/dev/examples/mock-v2-backend
        run: uv run --extra test pytest -q

  # Python SDK / CLI / TUI 测试（packages/python-sdk）。
  python-sdk-pytest:
    name: Python SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: SDK / CLI / TUI tests
        working-directory: packages/python-sdk
        run: uv run --extra test pytest -q
      - name: Build SDK distribution
        working-directory: packages/python-sdk
        run: uv build

  vitest:
    name: Frontend verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - name: pnpm install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: tsc + build (codegen reads checked-in snapshot)
        working-directory: apps/web
        env:
          OPENAPI_URL: ${{ github.workspace }}/apps/api/openapi.snapshot.json
        run: pnpm build
      # bundle size budget 守护：超过 .size-limit.json 阈值即阻断 PR。
      - name: Bundle size check
        working-directory: apps/web
        run: pnpm size
      - name: vitest with coverage
        working-directory: apps/web
        run: pnpm test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: apps/web/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Repository quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Repository format check
        run: pnpm format:check
      - name: codegen (read snapshot for typecheck)
        working-directory: apps/web
        env:
          OPENAPI_URL: ${{ github.workspace }}/apps/api/openapi.snapshot.json
        run: pnpm codegen
      - name: tsc --noEmit
        working-directory: apps/web
        run: pnpm typecheck
      - name: Repository lint
        run: pnpm lint
      - name: Pre-commit full repository check
        run: >-
          uv tool run --from pre-commit==4.6.1 pre-commit run
          --all-files --hook-stage manual --show-diff-on-failure
      - name: Repository Node script tests
        run: >-
          node --test scripts/audit-e2e-requirements.test.mjs
          scripts/check-workflow-names.test.mjs scripts/dev-worktree.test.mjs
          scripts/image-reference-utils.test.mjs scripts/plan-e2e-suites.test.mjs
          scripts/summarize-e2e-results.test.mjs
      - name: Workflow naming
        run: node scripts/check-workflow-names.mjs --strict

  docs-build:
    name: Docs build
    # 任何 PR 都跑：让 dead-link / hotkeys SoT 漂移 / snippet 不一致即时暴露。
    # 本地构建约 5s + prebuild 同步 openapi/hotkeys/snippet 约 2s。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm docs:build
        env:
          DOCS_BASE: /
        run: pnpm docs:build

  e2e-plan:
    name: Frontend E2E planning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      required: ${{ steps.plan.outputs.required }}
      run-suites: ${{ steps.plan.outputs.run_suites }}
      ml-cpu: ${{ steps.plan.outputs.ml_cpu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        env:
          E2E_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$E2E_BASE_SHA"
      - name: Select E2E suites
        id: plan
        env:
          E2E_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          E2E_DISPATCH_SCOPE: ${{ inputs.e2e_scope }}
          # Documented rollback: set the repository variable
          # E2E_SELECTION_MODE=legacy to restore the frozen pre-P8 selection
          # without a code change (empty/unset keeps the planned default).
          E2E_SELECTION_MODE: ${{ vars.E2E_SELECTION_MODE }}
        run: node scripts/plan-e2e-suites.mjs "$E2E_BASE_SHA" >> "$GITHUB_OUTPUT"
      # The planning job records the legacy-vs-planned comparison every run;
      # the stable `Frontend E2E` name is preserved across the P9 switch.
      - name: Record shadow E2E selection
        env:
          SHADOW: ${{ steps.plan.outputs.shadow }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const shadow = JSON.parse(process.env.SHADOW);
          const plannedSet = new Set(shadow.planned);
          const legacySet = new Set(shadow.legacy);
          const rows = [
            '| Suite | Legacy gate | §6 shadow proposal |',
            '| --- | --- | --- |',
            ...shadow.legacy.filter((suite) => !plannedSet.has(suite)).map((suite) => `| ${suite} | runs | proposed removal |`),
            ...shadow.planned.map((suite) => `| ${suite} | ${legacySet.has(suite) ? "runs" : "absent"} | runs |`),
          ];
          const lines = [
            '### E2E shadow selection (plan §6, warn-only — gate unchanged)',
            '',
            '```',
            `legacy:  ${shadow.legacy.join(', ') || '(none)'}`,
            `planned: ${shadow.planned.join(', ') || '(none)'}`,
            `added:   ${shadow.added.join(', ') || '(none)'}`,
            `removed: ${shadow.removed.join(', ') || '(none)'}`,
            '```',
            '',
            ...rows,
            '',
            'Reasons:',
            ...shadow.reasons.map((reason) => `- ${reason.suite}: ${reason.because}`),
            ...shadow.warnings.map((warning) => `- warning: ${warning}`),
            '',
            `ML CPU contract caller triggered: ${shadow.mlCpu === true}`,
            `Delegated ml-cpu suites (execution via ml-cpu-test.yml): ${shadow.sharedContracts.qualification.map((s) => s.suite).join(', ') || '(none)'}`,
            '',
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          NODE

  # P6 handoff wiring: the CPU contract suites (shared packages + five ML
  # backends, including the 12 CPU-torch files) execute through the dedicated
  # reusable workflow. Path filters live here; execution lives there.
  ml-cpu:
    name: ML CPU contract tests
    needs: [e2e-plan]
    if: needs.e2e-plan.outputs.ml-cpu == 'true'
    uses: ./.github/workflows/ml-cpu-test.yml
    with:
      suites: "all"

  e2e-suites:
    name: Frontend E2E execution
    needs: [e2e-plan]
    if: needs.e2e-plan.outputs.run-suites == 'true'
    uses: ./.github/workflows/e2e-run.yml
    with:
      matrix: ${{ needs.e2e-plan.outputs.matrix }}

  e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs: [e2e-plan, e2e-suites]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Collect per-suite status artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-*
          path: suite-status-raw
          merge-multiple: true
      - name: Audit planned suites against actual results
        if: needs.e2e-plan.outputs.required != ''
        env:
          E2E_REQUIRED: ${{ needs.e2e-plan.outputs.required }}
          E2E_RUN_SUITES: ${{ needs.e2e-plan.outputs.run-suites }}
        run: |
          printf '%s' "$E2E_REQUIRED" > required-suites.json
          if [ "$E2E_RUN_SUITES" = "true" ]; then
            node scripts/audit-e2e-requirements.mjs required-suites.json suite-status-raw/suite-status
          else
            # Documented docs-only skip: the manifest must carry an explicit
            # docs-only classification with a reason (validated by the audit).
            mkdir -p empty-status
            node scripts/audit-e2e-requirements.mjs required-suites.json empty-status
          fi
      - name: Require every planned E2E suite to pass
        env:
          E2E_PLAN_RESULT: ${{ needs.e2e-plan.result }}
          E2E_SUITES_RESULT: ${{ needs.e2e-suites.result }}
          E2E_RUN_SUITES: ${{ needs.e2e-plan.outputs.run-suites }}
        run: |
          test "$E2E_PLAN_RESULT" = success
          if [ "$E2E_RUN_SUITES" = "true" ]; then
            test "$E2E_SUITES_RESULT" = success
          else
            test "$E2E_SUITES_RESULT" = skipped
          fi
