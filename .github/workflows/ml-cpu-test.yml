# The registry in scripts/test-suites.json owns the selectable CPU suite list.
# Each suite uses an isolated environment; CPU success is not GPU qualification.
name: ML CPU tests

on:
  workflow_call:
    inputs:
      suites:
        description: 'Suite IDs from scripts/test-suites.json, comma/space separated, or all'
        required: false
        default: all
        type: string
  workflow_dispatch:
    inputs:
      suites:
        description: 'Suite IDs from scripts/test-suites.json, comma/space separated, or all'
        required: false
        default: all
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: ML CPU select suites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve requested suites
        id: plan
        env:
          SUITES: ${{ inputs.suites }}
        run: bash scripts/run-ml-cpu-tests.sh plan "$SUITES" >> "$GITHUB_OUTPUT"

  test:
    name: ML CPU ${{ matrix.suite }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: pip install uv
      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ml-cpu-uv-${{ runner.os }}-${{ matrix.suite }}-${{ hashFiles('apps/*/uv.lock', 'scripts/ml-cpu-deps/*', 'plugins/libreyolo/pyproject.toml') }}
          restore-keys: |
            ml-cpu-uv-${{ runner.os }}-${{ matrix.suite }}-
      - name: Run suite
        env:
          SUITE: ${{ matrix.suite }}
        run: bash scripts/run-ml-cpu-tests.sh run "$SUITE"
