# Reusable CPU test workflow for platform contracts and asset tooling.
#
# Caller contract:
#   uses: ./.github/workflows/ml-cpu-test.yml
#   with:
#     suites: all                     # default; or a comma/space separated subset of:
#                                     #   shared-protocol-v2, controlled-assets
#   (a call with no `suites` input runs every suite)
#
# Manual full entry: Actions -> "ML CPU tests" -> Run workflow.
#
# Each suite runs in its own throwaway venv so committed `sys.modules` torch
# stubs cannot leak across suites. Plugin package tests run in their repository.

name: ML CPU tests

on:
  workflow_call:
    inputs:
      suites:
        description: >-
          Comma/space separated subset of shared-protocol-v2, controlled-assets; or "all".
        required: false
        default: all
        type: string
  workflow_dispatch:
    inputs:
      suites:
        description: >-
          Comma/space separated subset of shared-protocol-v2, controlled-assets; or "all".
        required: false
        default: all
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: ML CPU select suites
    runs-on: ubuntu-latest
    outputs:
      shared_protocol_v2: ${{ steps.plan.outputs.shared_protocol_v2 }}
      controlled_assets: ${{ steps.plan.outputs.controlled_assets }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve requested suites
        id: plan
        env:
          SUITES: ${{ inputs.suites }}
        run: bash scripts/run-ml-cpu-tests.sh plan "$SUITES" >> "$GITHUB_OUTPUT"

  shared-protocol-v2:
    name: ML CPU shared protocol v2
    needs: plan
    if: needs.plan.outputs.shared_protocol_v2 == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        run: pip install uv
      - name: Run shared protocol v2 tests
        run: bash scripts/run-ml-cpu-tests.sh run shared-protocol-v2

  controlled-assets:
    name: ML CPU controlled asset administration
    needs: plan
    if: needs.plan.outputs.controlled_assets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Run controlled asset administration tests
        run: bash scripts/run-ml-cpu-tests.sh run controlled-assets
