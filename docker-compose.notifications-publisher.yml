services:
  notifications-publisher:
    image: aap-notifications:local
    build:
      context: .
      dockerfile: apps/notifications/Dockerfile
    environment:
      NOTIFICATION_PUBLISH_DATABASE_URL_FILE: /run/secrets/notification_publish_database_url
      NOTIFICATION_PUBLISH_REDIS_URL_FILE: /run/secrets/notification_publish_redis_url
      NOTIFICATION_PUBLISH_API_TOKEN_FILE: /run/secrets/notification_publication_token
      NOTIFICATION_PUBLISH_HOST: 0.0.0.0
      NOTIFICATION_PUBLISH_PORT: "8181"
    secrets:
      - notification_publish_database_url
      - notification_publish_redis_url
      - notification_publication_token
    user: "10004:10004"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8181/health/ready', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

secrets:
  notification_publish_database_url:
    file: ${NOTIFICATION_PUBLISH_DATABASE_URL_FILE:?Set Notifications publisher function-only DSN file}
  notification_publish_redis_url:
    file: ${NOTIFICATION_PUBLISH_REDIS_URL_FILE:?Set Notifications publish-only Redis DSN file}
  notification_publication_token:
    file: ${NOTIFICATION_PUBLISH_API_TOKEN_FILE:?Set Notifications private publication bearer file}
