[project]
name = "sam3-backend"
version = "0.10.0"
description = "SAM 3 ML Backend (facebookresearch/sam3) for ai-annotation-platform"
requires-python = ">=3.12,<3.13"

# torch / torchvision 由 docker base image (pytorch/pytorch:2.7.0-cuda12.6-cudnn-devel) 锁定,
# 不在此处重复声明以避免 pip 误升级覆盖预装版本.
# 与官仓 facebookresearch/sam3 的 README 对齐: CUDA 12.6+, Python 3.12, torch 2.7+.
dependencies = [
    "aap-backend-runtime",
    "aap-lifecycle-contract",
    "aap-protocol-v2",
    "anno-mask-utils",
    "aap-task-contract",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
    "numpy>=1.26,<3.0",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "shapely>=2.0",
    # huggingface_hub: SAM 3.1 是 gated repo, 拉权重必须传 HF_TOKEN.
    "huggingface_hub>=0.23",
    # transformers 5.x 对 SAM 3 友好 (Sam3Model / Sam3VideoModel 在 5.x 落地).
    # 具体下限以 facebookresearch/sam3 README 为准, sync_vendor.sh 升级后核对.
    "transformers>=4.45",
    "supervision>=0.21",
    "prometheus-client>=0.20",
    # PerfHud · GPU util/温度/功耗 + 容器 CPU/RAM
    "pynvml>=11.5",
    "psutil>=5.9",
    "cryptography>=43.0.0",
    "PyJWT>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "predictor", "video_predictor", "pvs_video_predictor", "schemas", "embedding_cache", "observability", "pool_domain", "gpu_lifecycle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plugin packages are installed distributions; platform contracts remain local.
pythonpath = ["../_shared/task_contract/src", ".", "../_shared/protocol_v2/src", "../_shared/lifecycle_contract/src"]

[tool.uv.sources]
aap-backend-runtime = { url = "https://github.com/YOAO-Labs/YOAO-Plugins/releases/download/python-6118885dd686/aap_backend_runtime-0.1.0-py3-none-any.whl" }
anno-mask-utils = { url = "https://github.com/YOAO-Labs/YOAO-Plugins/releases/download/python-6118885dd686/anno_mask_utils-0.1.0-py3-none-any.whl" }
aap-lifecycle-contract = { path = "../_shared/lifecycle_contract", editable = true }
aap-protocol-v2 = { path = "../_shared/protocol_v2", editable = true }
aap-task-contract = { path = "../_shared/task_contract", editable = true }
