[project]
name = "rapidocr-backend"
version = "0.1.0"
description = "RapidOCR ML backend — OCR (det 原子 + rec 原子 + e2e composite) for ai-annotation-platform"
requires-python = ">=3.10"

dependencies = [
    "aap-backend-runtime==0.1.0",
    "aap-lifecycle-contract",
    "aap-protocol-v2==0.2.0",
    "aap-task-contract==0.1.0",
    "cryptography>=43.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "PyJWT>=2.10,<3",
    "httpx>=0.27",
    "numpy==2.2.6",
    "Pillow>=10",
    "rapidocr==3.9.0",
    "opencv-python-headless==5.0.0.93",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
cpu = ["onnxruntime==1.23.2"]
cuda = [
    "onnxruntime-gpu==1.23.2",
    "nvidia-cudnn-cu12==9.10.2.21; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
build = ["setuptools==80.9.0", "wheel==0.45.1"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "predictor", "schemas", "catalog", "engine_pool", "gpu_lifecycle", "download_models", "plugin_assets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Source tests use the same shared packages installed as wheels in the image.
pythonpath = ["../_shared/task_contract/src", ".", "../_shared/protocol_v2/src", "../_shared/lifecycle_contract/src"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
aap-backend-runtime = { url = "https://github.com/YOAO-Labs/Plugin-SDK/releases/download/python-sdk-0.1.0/aap_backend_runtime-0.1.0-py3-none-any.whl" }
aap-lifecycle-contract = { path = "../_shared/lifecycle_contract", editable = true }
aap-protocol-v2 = { path = "../_shared/protocol_v2", editable = true }
aap-task-contract = { path = "../_shared/task_contract", editable = true }
