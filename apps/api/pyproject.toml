[tool.uv]
# nuScenes 1.1.11 pins legacy Shapely and Matplotlib. Keep this test oracle
# installable on supported Python versions and compatible with NumPy 2.
override-dependencies = ["shapely>=2.0", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = [
    "yoao-backend-runtime",
    "nuscenes-devkit==1.1.11",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --tb=short"
testpaths = ["tests"]
# Repository-level operator scripts (scripts/video_*.py) are consumed by the
# legacy video fence tests. `scripts` stays a namespace package, so this adds
# the repo-root modules without shadowing apps/api/scripts.
pythonpath = ["../.."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/migrations/*",
    "app/main.py",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
