[project]
name = "anno-api"
version = "0.26.0"
requires-python = ">=3.11"
dependencies = [
    "aap-protocol-v2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "redis>=5.2.0",
    "boto3>=1.35.0",
    # v0.11.14 · 存储连接器 SFTP/SSH 拉取（宿主机 & 同网段服务器）。
    "paramiko>=3.4.0",
    # v0.11.14 · 连接器凭据 Fernet 加密落库。cryptography 此前经 python-jose[cryptography]
    # 间接引入，这里显式声明，避免 jose extra 调整时被动失锁。
    "cryptography>=43.0.0",
    "celery>=5.4.0",
    "httpx>=0.28.0",
    "structlog>=25.5.0",
    "prometheus-client>=0.25.0",
    "Pillow>=10.0.0",
    # Large-image pyramids use libvips' lazy/sequential decode path. Pillow remains
    # a small-image thumbnail/oracle dependency and is not the production fallback.
    "pyvips>=3.0.0,<4.0.0",
    "numpy>=2.0.0",
    "scipy>=1.14,<2",
    # COCO compressed RLE is a production import/export codec, not only a test oracle.
    "pycocotools>=2.0.7",
    "blurhash-python>=1.2.0",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.18.0",
    # v0.10.16 · DuckDB 离线分析视图（ROADMAP §1.6）。Celery worker 写、API 只读。
    "duckdb>=1.1.0,<2.0.0",
]

[tool.uv.sources]
aap-protocol-v2 = { path = "../_shared/protocol_v2", editable = true }

[tool.uv]
# nuScenes 1.1.11 pins legacy Shapely and Matplotlib. Keep this test oracle
# installable on supported Python versions and compatible with NumPy 2.
override-dependencies = ["shapely>=2.0", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = [
    "nuscenes-devkit==1.1.11",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --tb=short"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/migrations/*",
    "app/main.py",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
