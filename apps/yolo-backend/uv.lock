version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "aap-backend-runtime" },
    { name = "aap-protocol-v2" },
    { name = "aap-task-contract" },
    { name = "aap-training-contract" },
    { name = "clip" },
    { name = "cryptography" },
    { name = "fastapi" },
    { name = "httpx" },
    { name = "lap" },
    { name = "libreyolo" },
    { name = "numpy" },
    { name = "opencv-python" },
    { name = "pillow" },
    { name = "prometheus-client" },
    { name = "psutil" },
    { name = "pydantic" },
    { name = "pyjwt" },
    { name = "pynvml" },
    { name = "setuptools" },
    { name = "torch" },
    { name = "torchvision" },
    { name = "ultralytics" },
    { name = "uvicorn", extra = ["standard"] },
    { name = "wheel" },
]

[package.optional-dependencies]
dev = [
    { name = "pytest" },
    { name = "pytest-asyncio" },
]

[package.metadata]
requires-dist = [
    { name = "aap-backend-runtime", editable = "../_shared/backend_runtime" },
    { name = "aap-protocol-v2", editable = "../_shared/protocol_v2" },
    { name = "aap-task-contract", editable = "../_shared/task_contract" },
    { name = "aap-training-contract", editable = "../_shared/training_contract" },
    { name = "clip", git = "https://github.com/ultralytics/CLIP.git?rev=7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40" },
    { name = "cryptography", specifier = ">=43.0.0" },
    { name = "fastapi", specifier = ">=0.110" },
    { name = "httpx", specifier = ">=0.27" },
    { name = "lap", specifier = ">=0.5.12" },
    { name = "libreyolo", specifier = "==1.6.0" },
    { name = "numpy", specifier = ">=1.24,<3.0" },
    { name = "opencv-python", specifier = ">=4.9" },
    { name = "pillow", specifier = ">=10.0" },
    { name = "prometheus-client", specifier = ">=0.20" },
    { name = "psutil", specifier = ">=5.9" },
    { name = "pydantic", specifier = ">=2.5" },
    { name = "pyjwt", specifier = ">=2.10,<3" },
    { name = "pynvml", specifier = ">=11.5" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8" },
    { name = "pytest-asyncio", marker = "extra == 'dev'", specifier = ">=0.23" },
    { name = "setuptools", specifier = ">=68" },
    { name = "torch", specifier = "==2.14.1", index = "https://download.pytorch.org/whl/cu132" },
    { name = "torchvision", specifier = "==0.29.1", index = "https://download.pytorch.org/whl/cu132" },
    { name = "ultralytics", specifier = "==8.4.183" },
    { name = "uvicorn", extras = ["standard"], specifier = ">=0.27" },
    { name = "wheel" },
]
provides-extras = ["dev"]
