[project]
name = "yolo-backend"
version = "0.1.0"
description = "YOLO (ultralytics) ML Backend for ai-annotation-platform — det/seg/pose/obb multi-task, multi-series"
requires-python = ">=3.11,<3.14"

# Binary packages are supplied by the matching immutable Docker base.
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
    "numpy>=1.24,<3.0",
    "pillow>=10.0",
    "opencv-python>=4.9",
    "prometheus-client>=0.20",
    "cryptography>=43.0.0",
    "PyJWT>=2.10,<3",
    "ultralytics==8.4.177",
    "clip",
    "setuptools>=68",
    "wheel",
    # Ultralytics tracker runtime dependency; bake it in instead of AutoUpdate.
    "lap>=0.5.12",
    # PerfHud · GPU util/温度/功耗 + 容器 CPU/RAM
    "pynvml>=11.5",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "predictor", "schemas", "model_pool", "model_registry", "observability", "gpu_lifecycle", "managed_models", "sample_evaluations"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
clip = { git = "https://github.com/ultralytics/CLIP.git", rev = "7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 共享包从 apps/_shared/* 注入: Docker 容器内由 `pip install -e /app/protocol_v2` 提供;
# 本地 pytest 通过 pythonpath 直接定位 src/.
pythonpath = [".", "../_shared/protocol_v2/src", "../_shared/mask_utils/src", "../_shared/backend_runtime/src"]
asyncio_mode = "auto"
