[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yoao-jobs"
version = "0.1.0"
description = "Portable Jobs-owned public notification scope fact contract"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10.0"]

[project.optional-dependencies]
queue-client = ["httpx>=0.28.1"]
dispatch-relay = ["asyncpg>=0.30.0", "httpx>=0.28.1"]
queue-runtime = [
    "celery>=5.4.0",
    "redis>=5.2.0",
    "starlette>=1.0.0",
    "uvicorn>=0.46.0",
]
test = [
    "celery>=5.4.0",
    "httpx>=0.28.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "starlette>=1.0.0",
]

[project.scripts]
yoao-jobs-queue = "yoao_jobs.queue_runtime:main"
yoao-jobs-dispatch-relay = "yoao_jobs.dispatch_relay:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yoao_jobs"]

[tool.hatch.build.targets.wheel.force-include]
"src/yoao_jobs/notification_scope.schema.json" = "yoao_jobs/notification_scope.schema.json"
"src/yoao_jobs/sql/notification_scope_facts.sql" = "yoao_jobs/sql/notification_scope_facts.sql"
"src/yoao_jobs/async_job_list_query.schema.json" = "yoao_jobs/async_job_list_query.schema.json"
"src/yoao_jobs/sql/async_job_list_query.sql" = "yoao_jobs/sql/async_job_list_query.sql"
"src/yoao_jobs/queue.schema.json" = "yoao_jobs/queue.schema.json"
"src/yoao_jobs/queue_routes.json" = "yoao_jobs/queue_routes.json"
"src/yoao_jobs/lifecycle.schema.json" = "yoao_jobs/lifecycle.schema.json"
"src/yoao_jobs/row_locks.schema.json" = "yoao_jobs/row_locks.schema.json"
"src/yoao_jobs/domain_queries.schema.json" = "yoao_jobs/domain_queries.schema.json"
"src/yoao_jobs/fixture_cleanup.schema.json" = "yoao_jobs/fixture_cleanup.schema.json"
"src/yoao_jobs/fixture_guard.schema.json" = "yoao_jobs/fixture_guard.schema.json"
"src/yoao_jobs/prediction_retirement.schema.json" = "yoao_jobs/prediction_retirement.schema.json"

"src/yoao_jobs/fixture_filter.schema.json" = "yoao_jobs/fixture_filter.schema.json"

"src/yoao_jobs/action_idempotency.schema.json" = "yoao_jobs/action_idempotency.schema.json"
"src/yoao_jobs/dispatch.schema.json" = "yoao_jobs/dispatch.schema.json"
"src/yoao_jobs/media_preparation.schema.json" = "yoao_jobs/media_preparation.schema.json"
"src/yoao_jobs/sql/0447_jobs_publication_execution.sql" = "yoao_jobs/sql/0447_jobs_publication_execution.sql"
"src/yoao_jobs/sql/0447_jobs_fixture_media_publication.sql" = "yoao_jobs/sql/0447_jobs_fixture_media_publication.sql"
"src/yoao_jobs/sql/0502_jobs_ordinary_ledger.sql" = "yoao_jobs/sql/0502_jobs_ordinary_ledger.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
