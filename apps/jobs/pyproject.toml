[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aap-jobs"
version = "0.1.0"
description = "Portable Jobs-owned public notification scope fact contract"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10.0"]

[project.optional-dependencies]
test = ["pytest>=8.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aap_jobs"]

[tool.hatch.build.targets.wheel.force-include]
"src/aap_jobs/notification_scope.schema.json" = "aap_jobs/notification_scope.schema.json"
"src/aap_jobs/sql/notification_scope_facts.sql" = "aap_jobs/sql/notification_scope_facts.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
