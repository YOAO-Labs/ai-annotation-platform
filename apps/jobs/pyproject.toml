[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yoao-jobs"
version = "0.1.0"
description = "Portable Jobs-owned public notification scope fact contract"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10.0"]

[project.optional-dependencies]
queue-client = ["httpx>=0.28.1"]
dispatch-relay = ["asyncpg>=0.30.0", "httpx>=0.28.1"]
queue-runtime = [
    "celery>=5.4.0",
    "redis>=5.2.0",
    "starlette>=1.0.0",
    "uvicorn>=0.46.0",
]
test = [
    "celery>=5.4.0",
    "httpx>=0.28.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "starlette>=1.0.0",
]

[project.scripts]
yoao-jobs-queue = "yoao_jobs.queue_runtime:main"
yoao-jobs-dispatch-relay = "yoao_jobs.dispatch_relay:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yoao_jobs"]

[tool.hatch.build.targets.wheel.force-include]
"src/yoao_jobs/notification_scope.schema.json" = "yoao_jobs/notification_scope.schema.json"
"src/yoao_jobs/sql/notification_scope_facts.sql" = "yoao_jobs/sql/notification_scope_facts.sql"
