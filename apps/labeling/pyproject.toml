[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yoao-labeling"
version = "0.1.0"
description = "Portable Labeling task, annotation, query and video contracts"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "yoao-preannotation-results",
    "yoao-assets-media",
    "yoao-assets-mask-content",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "src/**/*.py" },
    { file = "src/**/*.json" },
    { file = "src/**/*.sql" },
]

[project.optional-dependencies]
client = ["httpx>=0.28"]
postgres = ["yoao-owner-data", "asyncpg>=0.29"]
runtime = [
    "yoao-owner-data",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn>=0.30",
    "yoao-assets-mask-content[client]",
]
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28"]

[tool.uv.sources]
yoao-owner-data = { path = "../_shared/owner_data", editable = true }
yoao-preannotation-results = { path = "../preannotation-results", editable = true }
yoao-assets-media = { path = "../assets-media", editable = true }
yoao-assets-mask-content = { path = "../assets-mask-content", editable = true }

[project.scripts]
yoao-labeling-video-writer = "yoao_labeling.video_writer_main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yoao_labeling"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
