[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aap-audit"
version = "0.1.0"
description = "Portable same-transaction audit append contract and PostgreSQL client"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10.0"]

[project.optional-dependencies]
postgres = ["sqlalchemy[asyncio]>=2.0.0"]
test = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aap_audit"]

[tool.hatch.build.targets.wheel.force-include]
"src/aap_audit/append.schema.json" = "aap_audit/append.schema.json"
"src/aap_audit/sql/0315_audit_append.sql" = "aap_audit/sql/0315_audit_append.sql"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
