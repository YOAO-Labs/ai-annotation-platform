[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yoao-audit"
version = "0.1.0"
description = "Portable Audit capabilities and maintenance runtime"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10.0"]

[project.optional-dependencies]
postgres = ["sqlalchemy[asyncio]>=2.0.0"]
runtime = ["yoao-owner-data", "asyncpg>=0.30.0", "boto3>=1.35.0"]
test = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
yoao-audit-maintenance = "yoao_audit.maintenance_runtime:main"

[tool.uv.sources]
yoao-owner-data = { path = "../_shared/owner_data", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/yoao_audit"]

[tool.hatch.build.targets.wheel.force-include]
"src/yoao_audit/append.schema.json" = "yoao_audit/append.schema.json"
"src/yoao_audit/query.schema.json" = "yoao_audit/query.schema.json"
"src/yoao_audit/read_relations.schema.json" = "yoao_audit/read_relations.schema.json"
"src/yoao_audit/daily_projection.schema.json" = "yoao_audit/daily_projection.schema.json"
"src/yoao_audit/maintenance.schema.json" = "yoao_audit/maintenance.schema.json"
"src/yoao_audit/sql/0315_audit_append.sql" = "yoao_audit/sql/0315_audit_append.sql"
"src/yoao_audit/sql/0317_audit_query.sql" = "yoao_audit/sql/0317_audit_query.sql"
"src/yoao_audit/sql/0320_audit_read_relations.sql" = "yoao_audit/sql/0320_audit_read_relations.sql"
"src/yoao_audit/sql/0322_audit_daily_projection.sql" = "yoao_audit/sql/0322_audit_daily_projection.sql"
"src/yoao_audit/sql/0333_audit_maintenance.sql" = "yoao_audit/sql/0333_audit_maintenance.sql"
"src/yoao_audit/sql/0366_audit_fixture_cleanup.sql" = "yoao_audit/sql/0366_audit_fixture_cleanup.sql"
"src/yoao_audit/sql/0437_fixture_audit_cleanup.sql" = "yoao_audit/sql/0437_fixture_audit_cleanup.sql"
"src/yoao_audit/sql/0438_fixture_audit_namespace.sql" = "yoao_audit/sql/0438_fixture_audit_namespace.sql"
"src/yoao_audit/sql/0485_audit_platform_maintenance.sql" = "yoao_audit/sql/0485_audit_platform_maintenance.sql"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
