[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aap-audit"
version = "0.1.0"
description = "Portable Audit capabilities and maintenance runtime"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10.0"]

[project.optional-dependencies]
postgres = ["sqlalchemy[asyncio]>=2.0.0"]
runtime = ["aap-owner-data", "asyncpg>=0.30.0", "boto3>=1.35.0"]
test = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
aap-audit-maintenance = "aap_audit.maintenance_runtime:main"

[tool.uv.sources]
aap-owner-data = { path = "../_shared/owner_data", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/aap_audit"]

[tool.hatch.build.targets.wheel.force-include]
"src/aap_audit/append.schema.json" = "aap_audit/append.schema.json"
"src/aap_audit/query.schema.json" = "aap_audit/query.schema.json"
"src/aap_audit/read_relations.schema.json" = "aap_audit/read_relations.schema.json"
"src/aap_audit/daily_projection.schema.json" = "aap_audit/daily_projection.schema.json"
"src/aap_audit/maintenance.schema.json" = "aap_audit/maintenance.schema.json"
"src/aap_audit/sql/0315_audit_append.sql" = "aap_audit/sql/0315_audit_append.sql"
"src/aap_audit/sql/0317_audit_query.sql" = "aap_audit/sql/0317_audit_query.sql"
"src/aap_audit/sql/0320_audit_read_relations.sql" = "aap_audit/sql/0320_audit_read_relations.sql"
"src/aap_audit/sql/0322_audit_daily_projection.sql" = "aap_audit/sql/0322_audit_daily_projection.sql"
"src/aap_audit/sql/0333_audit_maintenance.sql" = "aap_audit/sql/0333_audit_maintenance.sql"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
