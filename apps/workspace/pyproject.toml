[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aap-workspace"
version = "0.1.0"
description = "Portable Workspace membership, owner-transfer and configuration values/policy"
requires-python = ">=3.11"
dependencies = ["aap-workspace-contract", "pydantic>=2.10"]

[tool.uv.sources]
aap-workspace-contract = { path = "../_shared/workspace_contract", editable = true }

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
runtime = [
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn>=0.30",
]
client = ["httpx>=0.27"]
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aap_workspace = [
    "membership_protocol.schema.json",
    "owner_transfer_protocol.schema.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
