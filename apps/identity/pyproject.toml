[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yoao-identity"
version = "0.1.0"
description = "Portable Identity admission contract and credential verifier"
requires-python = ">=3.11"
dependencies = [
    "yoao-identity-admission>=0.1.0",
    "yoao-notifications>=0.1.0",
    "pydantic>=2.5",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "src/**/*.py" },
    { file = "src/**/*.json" },
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
runtime = [
    "yoao-mail-transport>=0.1.0",
    "yoao-notifications[runtime]>=0.1.0",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "redis>=5.2.0",
    "uvicorn>=0.30",
]
test = [
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
yoao-identity-admission = { path = "../_shared/identity_admission", editable = true }
yoao-mail-transport = { path = "../_shared/mail_transport", editable = true }
yoao-notifications = { path = "../notifications", editable = true }

[project.scripts]
yoao-identity = "yoao_identity_runtime.__main__:main"
yoao-identity-mail = "yoao_identity_runtime.mail_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yoao_identity", "src/yoao_identity_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
