[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aap-identity"
version = "0.1.0"
description = "Portable Identity admission contract and credential verifier"
requires-python = ">=3.11"
dependencies = [
    "aap-notifications>=0.1.0",
    "pydantic>=2.5",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "src/**/*.py" },
    { file = "src/**/*.json" },
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
runtime = [
    "aap-mail-transport>=0.1.0",
    "aap-notifications[runtime]>=0.1.0",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "redis>=5.2.0",
    "uvicorn>=0.30",
]
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.uv.sources]
aap-mail-transport = { path = "../_shared/mail_transport", editable = true }
aap-notifications = { path = "../notifications", editable = true }

[project.scripts]
aap-identity = "aap_identity_runtime.__main__:main"
aap-identity-mail = "aap_identity_runtime.mail_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aap_identity", "src/aap_identity_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
