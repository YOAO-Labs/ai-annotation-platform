[project]
name = "yoao-training-executor"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "yoao-sdk",
  "httpx==0.28.1",
  "psutil==7.0.0",
]

[dependency-groups]
handoff = ["httpx", "psutil", "yoao-sdk"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["training_executor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
yoao-sdk = { path = "../../packages/python-sdk", editable = true }
