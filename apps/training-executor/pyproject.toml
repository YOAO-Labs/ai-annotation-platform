[project]
name = "yoao-training-executor"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "yoao-sdk",
  "httpx==0.28.1",
  "psutil==7.0.0",
]

[project.optional-dependencies]
legacy-ml = [
  "ultralytics==8.4.183",
  "libreyolo==1.6.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "pillow>=11,<12",
  "pyyaml==6.0.2",
]

[dependency-groups]
handoff = ["httpx", "psutil", "yoao-sdk"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["training_executor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
yoao-sdk = { path = "../../packages/python-sdk", editable = true }
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
