[project]
name = "aap-training-executor"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aap-task-contract",
  "aap-training-contract",
  "httpx==0.28.1",
  "ultralytics==8.4.183",
  "libreyolo==1.6.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "pillow>=11,<12",
  "pyyaml==6.0.2",
  "psutil==7.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["training_executor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
aap-task-contract = { path = "../_shared/task_contract", editable = true }
aap-training-contract = { path = "../_shared/training_contract", editable = true }
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
