[project]
name = "aap-assets-catalog"
version = "0.1.0"
description = "Standalone Assets catalog control-plane runtime and frozen contract"
requires-python = ">=3.11"
dependencies = ["aap-assets-source>=0.1.0", "aap-workspace-contract>=0.1.0", "pydantic>=2.10.0"]

[project.optional-dependencies]
server = [
    "asyncpg>=0.30.0",
    "boto3>=1.43.77",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff==0.15.22",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
aap-workspace-contract = { path = "../_shared/workspace_contract", editable = true }
aap-assets-source = { path = "../assets-source", editable = true }

[tool.setuptools.package-data]
aap_assets_catalog = ["spatial_contract.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
