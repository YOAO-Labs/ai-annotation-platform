[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aap-inference"
version = "0.1.0"
description = "Portable inference request values and backend capability normalization"
requires-python = ">=3.11"
dependencies = ["aap-task-contract", "aap-protocol-v2", "pydantic>=2.10.0"]

[project.optional-dependencies]
probe = ["httpx>=0.28.0"]
test = ["pytest>=8.3.0", "httpx>=0.28.0"]

[tool.uv.sources]
aap-task-contract = { path = "../_shared/task_contract", editable = true }
aap-protocol-v2 = { path = "../_shared/protocol_v2", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
