[project]
name = "onnxtools-backend"
version = "0.3.0"
description = "onnxtools (rtdetr + vehicle-attribute) ML backend — two-stage vehicle attribute pre-annotation for ai-annotation-platform"
requires-python = ">=3.10"

dependencies = [
    "aap-backend-runtime==0.1.0",
    "aap-protocol-v2==0.2.0",
    "aap-task-contract==0.1.0",
    "cryptography>=43.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "PyJWT>=2.10,<3",
    "httpx>=0.27",
    "numpy==2.2.6",
    "onnxtools[inference] @ git+https://github.com/yyq19990828/onnxtools.git@102fcfeb08fc00f865c334a181bfd0bb518e5ed8",
    "onnxruntime-gpu==1.22.0",
    "opencv-contrib-python-headless==5.0.0.93",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
build = ["setuptools==80.9.0", "wheel==0.45.1"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "predictor", "schemas", "attribute_schema", "handle_pool", "gpu_lifecycle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Source tests use the same shared packages installed as wheels in the image.
pythonpath = ["../_shared/task_contract/src", ".", "../_shared/protocol_v2/src", "../_shared/lifecycle_contract/src", "../_shared/backend_runtime/src"]

[tool.uv.sources]
aap-backend-runtime = { path = "../_shared/backend_runtime" }
aap-lifecycle-contract = { path = "../_shared/lifecycle_contract", editable = true }
aap-protocol-v2 = { path = "../_shared/protocol_v2", editable = true }
aap-task-contract = { path = "../_shared/task_contract", editable = true }
