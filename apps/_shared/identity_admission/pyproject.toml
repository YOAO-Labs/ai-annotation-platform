[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aap-identity-admission"
version = "0.1.0"
description = "Portable Identity admission contracts and remote client"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
http = ["httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/aap_identity_admission"]
