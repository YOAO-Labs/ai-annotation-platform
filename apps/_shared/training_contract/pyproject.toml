[project]
name = "aap-training-contract"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["aap-task-contract"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
training_contract = ["native_inventory*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
aap-task-contract = { path = "../task_contract", editable = true }
