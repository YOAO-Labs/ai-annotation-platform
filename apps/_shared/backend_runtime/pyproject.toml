[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aap-backend-runtime"
version = "0.1.0"
description = "ML backend 运行时共享无状态叶子函数 (图片下载 / 显存释放 / /versions 载荷 / GPU 快照), 被 yolo / sam3 / grounded-sam2 / onnxtools / rapidocr 等 backend 复用"
requires-python = ">=3.10"
# torch 故意不在此声明: 各 backend 的 torch / torchvision 由 docker base image 锁定 (见各
# backend pyproject 注释), 在此声明会让 `pip install -e` 误升级覆盖预装版本。free_gpu_memory /
# gpu_info_snapshot 内部把 `import torch` 包在 try 里, torch 不可用时降级为 no-op / 返回 {}。
# httpx / pillow 仅 fetch_image 用 (惰性 import), onnxtools / rapidocr 经本包 editable 安装补上 pillow。
dependencies = [
    "aap-protocol-v2",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.uv.sources]
aap-protocol-v2 = { path = "../protocol_v2", editable = true }
