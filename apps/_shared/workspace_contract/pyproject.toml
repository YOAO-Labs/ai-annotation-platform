[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aap-workspace-contract"
version = "0.1.0"
description = "Public immutable Workspace read contract and pure project projections"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10.0"]

[project.optional-dependencies]
test = ["pytest>=8.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aap_workspace_contract = ["*.json"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
    { file = "src/**/*.json" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
