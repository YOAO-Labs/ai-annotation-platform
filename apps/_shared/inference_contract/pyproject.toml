[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aap-inference-contract"
version = "0.1.0"
description = "Portable contracts for credential-owning Inference backend probes"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10.0"]

[project.optional-dependencies]
client = ["httpx>=0.28.0"]
test = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.28.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aap_inference_contract"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
    { file = "src/**/*.json" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
