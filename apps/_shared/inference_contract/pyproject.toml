[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aap-inference-contract"
version = "0.1.0"
description = "Portable contracts for credential-owning Inference backend probes"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10.0"]

[project.optional-dependencies]
client = ["httpx>=0.28.0"]
test = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.28.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aap_inference_contract = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
