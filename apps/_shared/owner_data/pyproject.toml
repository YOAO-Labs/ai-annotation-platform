[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aap-owner-data"
version = "0.1.0"
description = "Neutral PostgreSQL capability checks for independent owner clients"
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/aap_owner_data"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "src/**/*.py" },
]
