[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aap-labeling-mask-gc"
version = "0.1.0"
description = "Portable Labeling-owned Mask deletion fences and cleanup runtime"
requires-python = ">=3.11"
dependencies = [
    "aap-assets-mask-content>=0.1.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
client = ["httpx>=0.27.0"]
runtime = ["asyncpg>=0.30.0", "httpx>=0.27.0"]
server = [
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn>=0.34.0",
]
test = [
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff==0.15.22",
    "uvicorn>=0.34.0",
]

[project.scripts]
aap-labeling-mask-gc = "aap_labeling_mask_gc_runtime.__main__:main"

[tool.uv.sources]
aap-assets-mask-content = { path = "../assets-mask-content", editable = true }

[tool.setuptools.package-data]
aap_labeling_mask_gc = ["protocol.schema.json", "openapi.snapshot.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"
