[project]
name = "aap-assets-cleanup"
version = "0.1.0"
description = "Standalone worker for the Assets-owned object cleanup outbox"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10.0", "aap-assets-media"]

[project.optional-dependencies]
worker = ["asyncpg>=0.30.0", "boto3>=1.43.77"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff==0.15.22",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
aap-assets-media = { path = "../assets-media" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
