[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aap-assets-source"
version = "0.1.0"
description = "Assets source contracts and independent SQL/S3 runtime"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "cryptography>=43.0.0",
    "aap-audit-contract",
    "aap-assets-cleanup",
]

[project.optional-dependencies]
client = ["httpx>=0.27.0"]
server = [
    "aap-assets-media",
    "asyncpg>=0.30.0",
    "anyio>=4.7.0",
    "boto3>=1.43.77",
    "fastapi>=0.115.0",
    "paramiko>=3.4.0",
    "pillow>=10.0.0",
    "uvicorn>=0.34.0",
]
importer = [
    "aap-assets-media",
    "asyncpg>=0.30.0",
    "boto3>=1.43.77",
    "paramiko>=3.4.0",
    "pillow>=10.0.0",
]
test = [
    "aap-assets-media",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff==0.15.22",
]

[tool.uv.sources]
aap-audit-contract = { path = "../_shared/audit_contract", editable = true }
aap-assets-cleanup = { path = "../assets-cleanup", editable = true }
aap-assets-media = { path = "../assets-media", editable = true }

[tool.setuptools.package-data]
aap_assets_source = [
    "operator_contract.schema.json",
    "connections_contract.schema.json",
    "import_contract.schema.json",
    "ingest_contract.schema.json",
    "protocol.schema.json",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
