[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aap-assets-source"
version = "0.1.0"
description = "Public language-neutral contracts for Assets source operations"
requires-python = ">=3.11"
dependencies = [
    "aap-audit-contract",
    "aap-assets-cleanup",
]

[project.optional-dependencies]
server = [
    "asyncpg>=0.30.0",
    "boto3>=1.43.77",
    "fastapi>=0.115.0",
    "pillow>=10.0.0",
    "uvicorn>=0.34.0",
]
test = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff==0.15.22",
]

[tool.uv.sources]
aap-audit-contract = { path = "../_shared/audit_contract", editable = true }
aap-assets-cleanup = { path = "../assets-cleanup", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
