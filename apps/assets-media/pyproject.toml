[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aap-assets-media"
version = "0.1.0"
description = "Portable Assets media contracts and independently deployable execution"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10.0"]

[project.optional-dependencies]
runtime = [
    "asyncpg>=0.30.0",
    "boto3>=1.43.77",
    "pillow>=10.0.0",
    "blurhash-python>=1.2.2",
    "httpx>=0.27.0",
    "pyvips>=3.1.1",
    "aap-media-probe[client]",
]
client = ["httpx>=0.27.0"]
server = ["fastapi>=0.115.0", "uvicorn>=0.34.0"]
test = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0", "fastapi>=0.115.0", "ruff==0.15.22"]

[tool.uv.sources]
aap-media-probe = { path = "../media-probe", editable = true }

[tool.setuptools.package-data]
aap_assets_media = ["protocol.schema.json", "openapi.snapshot.json", "sql/*.sql"]
aap_assets_images = ["protocol.schema.json", "openapi.snapshot.json"]
aap_assets_inputs = ["protocol.schema.json", "openapi.snapshot.json"]
aap_assets_input_manifests = ["protocol.schema.json", "openapi.snapshot.json"]
aap_assets_video_inputs = ["protocol.schema.json", "authority.schema.json", "execution.schema.json", "selection.schema.json", "evidence.schema.json", "control.schema.json", "openapi.snapshot.json", "tracker.schema.json", "tracker-control.schema.json", "tracker-openapi.snapshot.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
