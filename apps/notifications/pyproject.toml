[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aap-notifications"
version = "0.1.0"
description = "Portable Notifications contracts and PostgreSQL capability clients"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10.0"]

[project.optional-dependencies]
postgres = ["sqlalchemy[asyncio]>=2.0.0"]
test = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aap_notifications"]

[tool.hatch.build.targets.wheel.force-include]
"src/aap_notifications/sql/0311_notifications_preferences.sql" = "aap_notifications/sql/0311_notifications_preferences.sql"
"src/aap_notifications/sql/0314_notifications_append.sql" = "aap_notifications/sql/0314_notifications_append.sql"
"src/aap_notifications/sql/0316_notifications_read_state.sql" = "aap_notifications/sql/0316_notifications_read_state.sql"
"src/aap_notifications/sql/0318_notifications_delete.sql" = "aap_notifications/sql/0318_notifications_delete.sql"
"src/aap_notifications/preferences.schema.json" = "aap_notifications/preferences.schema.json"
"src/aap_notifications/preferences.policy.json" = "aap_notifications/preferences.policy.json"
"src/aap_notifications/append.schema.json" = "aap_notifications/append.schema.json"
"src/aap_notifications/read_state.schema.json" = "aap_notifications/read_state.schema.json"
"src/aap_notifications/delete.schema.json" = "aap_notifications/delete.schema.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
