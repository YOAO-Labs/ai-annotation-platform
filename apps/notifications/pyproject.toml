[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yoao-notifications"
version = "0.1.0"
description = "Portable Notifications contracts and PostgreSQL capability clients"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10.0"]

[project.optional-dependencies]
postgres = ["sqlalchemy[asyncio]>=2.0.0"]
runtime = [
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "starlette>=1.0.0",
    "uvicorn>=0.46.0",
]
publication-client = ["httpx>=0.28.1"]
channels = [
    "cryptography>=43.0.0",
    "httpx>=0.28.1",
]
websocket = [
    "yoao-identity-admission[http]",
    "yoao-owner-data",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "starlette>=1.0.0",
    "uvicorn[standard]>=0.46.0",
]
test = [
    "cryptography>=43.0.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "starlette>=1.0.0",
]

[project.scripts]
yoao-notifications-publisher = "yoao_notifications.delivery_worker:main"
yoao-notifications-socket = "yoao_notifications.websocket_runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yoao_notifications"]

[tool.hatch.build.targets.wheel.force-include]
"src/yoao_notifications/sql/0484_notifications_terminal_outbox.sql" = "yoao_notifications/sql/0484_notifications_terminal_outbox.sql"
"src/yoao_notifications/sql/0510_notification_channels.sql" = "yoao_notifications/sql/0510_notification_channels.sql"
"src/yoao_notifications/preferences.schema.json" = "yoao_notifications/preferences.schema.json"
"src/yoao_notifications/preferences.policy.json" = "yoao_notifications/preferences.policy.json"
"src/yoao_notifications/append.schema.json" = "yoao_notifications/append.schema.json"
"src/yoao_notifications/read_state.schema.json" = "yoao_notifications/read_state.schema.json"
"src/yoao_notifications/delete.schema.json" = "yoao_notifications/delete.schema.json"
"src/yoao_notifications/read_relations.schema.json" = "yoao_notifications/read_relations.schema.json"
"src/yoao_notifications/terminal_append.schema.json" = "yoao_notifications/terminal_append.schema.json"
"src/yoao_notifications/inbox_query.schema.json" = "yoao_notifications/inbox_query.schema.json"
"src/yoao_notifications/delivery_read.schema.json" = "yoao_notifications/delivery_read.schema.json"
"src/yoao_notifications/notification_delivery_protocol.schema.json" = "yoao_notifications/notification_delivery_protocol.schema.json"
"src/yoao_notifications/realtime_event.schema.json" = "yoao_notifications/realtime_event.schema.json"
"src/yoao_notifications/publication.schema.json" = "yoao_notifications/publication.schema.json"

[tool.uv.sources]
yoao-identity-admission = { path = "../_shared/identity_admission", editable = true }
yoao-owner-data = { path = "../_shared/owner_data", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
